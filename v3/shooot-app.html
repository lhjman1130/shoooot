<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shoooot 3 — 레퍼런스 슛</title>
<link rel="manifest" href="mobile/manifest.webmanifest">
<meta name="theme-color" content="#7B5BE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="mobile/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg: oklch(0.976 0.012 305);
  --bg-deep: oklch(0.955 0.020 302);
  --surface: #fff;
  --surface-2: oklch(0.985 0.008 305);
  --fg: oklch(0.27 0.045 300);
  --muted: oklch(0.56 0.032 300);
  --border: oklch(0.915 0.018 302);
  --accent: oklch(0.60 0.185 300);
  --accent-ink: oklch(0.42 0.16 300);
  --accent-soft: oklch(0.945 0.035 302);
  --danger: oklch(0.58 0.17 22);
  --r-l: 28px; --r-m: 18px; --r-s: 12px;
  --sh-1: 0 1px 2px rgba(76,44,130,.05), 0 6px 16px -10px rgba(76,44,130,.22);
  --sh-2: 0 2px 6px rgba(76,44,130,.06), 0 18px 40px -18px rgba(76,44,130,.30);
  --sh-3: 0 30px 80px -30px rgba(60,30,110,.45);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --std: cubic-bezier(.2,0,0,1);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 520px at 50% -220px, oklch(0.94 0.055 302) 0%, transparent 62%),
    var(--bg);
  color:var(--fg);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,
    "Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 소형 텍스트(≤13px)는 양수 트래킹 — body 의 -.01em 을 되돌린다 */
.card-room,.chip .n,.badge,.thumb .kind,.help,.card .ai,.meta,.aitag,.optional,
.ibx .from,.ibx .info p,.res .where,.slot .name,.slot .arm-hint,.pickslot .nm,
.setrow .d,.panel-sub,.aihint,.inbox-head p,.hintbar .lead,.srcchip .u,
th,.errbox .ago,.slow,.subseg button .n{letter-spacing:.014em}

/* 눌림 피드백 — hover 만으로는 클릭이 확인되지 않는다 */
.btn:active,.ghost-btn:active,.chip:active,.tab:active,.aibtn:active,
.selbar button:active,.pickrow:active{transform:translateY(1px) scale(.986)}
.x:active,.gear:active,.pick:active,.clr:active{transform:scale(.9)}
.card:active{transform:translateY(-1px)}
.sw:active,.gl:active{transform:scale(.94)}
.slot:active .tile{transform:translateY(-2px) scale(1.02)}
.searchbox .clr:active{transform:translateY(-50%) scale(.9)}

/* ───────── shell ───────── */
.wrap{max-width:1060px;margin:0 auto;padding:0 20px 120px}
.masthead{position:relative;padding:34px 0 8px;text-align:center}
.wordmark{
  font-size:clamp(40px,7vw,60px);font-weight:900;letter-spacing:-.05em;line-height:1;
  display:inline-block;
}
.wordmark .o{
  background:linear-gradient(135deg,#A98CFF,#7B5BE0 55%,#C77BE8);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tagline{margin-top:9px;font-size:14px;color:var(--muted);font-weight:500}
.gear{
  position:absolute;top:30px;right:0;width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--sh-1);color:var(--muted);transition:transform .18s var(--spring),color .18s
}
.gear:hover{color:var(--accent);transform:rotate(35deg)}
.gear svg{width:17px;height:17px}

.tabbar{position:sticky;top:0;z-index:40;padding:16px 0 14px;margin-top:14px;
  background:linear-gradient(var(--bg) 62%,transparent);backdrop-filter:blur(6px)}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tab{
  display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 20px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-1);
  font-weight:700;font-size:14.5px;color:var(--fg);
  transition:transform .16s var(--spring),box-shadow .18s var(--std),background .18s var(--std)
}
.tab svg{width:17px;height:17px;opacity:.7}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{
  background:linear-gradient(135deg,#9B7BF0,#7B5BE0);color:#fff;border-color:transparent;
  box-shadow:0 6px 18px -6px rgba(110,70,215,.6)
}
.tab[aria-selected="true"] svg{opacity:1}

/* ───────── shoot: hint + sources ───────── */
.hintbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);
  padding:13px 16px;box-shadow:var(--sh-1);margin:6px 0 20px
}
.hintbar .lead{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted);font-weight:500}
.hintbar .lead svg{width:16px;height:16px;color:var(--muted);flex:none}
.hintbar kbd{
  font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent-ink);
  border-radius:6px;padding:2.5px 6px;font-weight:600
}
.sources{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.srcchip{
  display:inline-flex;align-items:center;gap:7px;max-width:230px;
  background:var(--surface-2);border:1px dashed oklch(0.85 0.05 302);border-radius:999px;
  padding:6px 12px 6px 9px;font-size:12.5px;color:var(--fg);cursor:grab;
  transition:transform .16s var(--spring),border-color .16s,background .16s
}
.srcchip:hover{transform:translateY(-2px);border-color:var(--accent);background:var(--accent-soft)}
.srcchip:active{cursor:grabbing}
.srcchip .favicon{width:18px;height:18px;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:10px;font-weight:800;color:#fff}
.srcchip .u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-family:var(--mono);font-size:11.5px}

/* ───────── shoot: groups + icons ───────── */
.group{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);
  padding:18px 20px 22px;box-shadow:var(--sh-1);margin-bottom:16px
}
.group-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.subseg{padding:4px;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;
  scrollbar-width:none;-ms-overflow-style:none}
.subseg::-webkit-scrollbar{display:none}
.subseg button{flex:none}
.subseg button{height:36px;padding:0 17px;font-size:13.5px;font-weight:700}
.subseg button .n{font-family:var(--mono);font-size:11px;font-weight:600;opacity:.65;margin-left:7px}
.subseg button[aria-selected="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:var(--sh-1)}
.subseg button[aria-selected="false"]{color:var(--muted)}
.subseg button:hover{color:var(--accent-ink)}
.group-head h2{font-size:15px;font-weight:800;letter-spacing:-.02em}
.group-head .kicker{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.085em}
.group-head .count{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.iconrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:16px 10px}

.slot{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.tile{
  position:relative;width:70px;height:70px;border-radius:22px;
  background:linear-gradient(150deg,var(--g1),var(--g2));
  display:grid;place-items:center;color:#fff;
  box-shadow:0 1px 1px rgba(255,255,255,.6) inset,0 8px 18px -8px var(--g2),0 1px 3px rgba(50,25,100,.18);
  transition:transform .2s var(--spring),box-shadow .2s var(--std);
  cursor:pointer
}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.32),transparent 52%);pointer-events:none}
.tile svg{width:30px;height:30px;position:relative;z-index:1;filter:drop-shadow(0 1px 1px rgba(40,20,80,.25))}
.slot:hover .tile{transform:translateY(-4px) scale(1.045)}
.slot.armed .tile{transform:translateY(-4px) scale(1.06);
  box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent),0 12px 26px -10px var(--g2)}
.slot.dropping .tile{transform:scale(1.12);box-shadow:0 0 0 3px var(--bg),0 0 0 7px var(--accent)}
.slot.pop .tile{animation:pop .42s var(--spring)}
@keyframes pop{0%{transform:scale(1)}38%{transform:scale(.9)}70%{transform:scale(1.09)}100%{transform:scale(1)}}
.badge{
  position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;
  background:var(--fg);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;
  display:grid;place-items:center;border:2.5px solid var(--bg);z-index:3;line-height:1;
  box-shadow:0 2px 6px rgba(40,20,80,.3)
}
.badge.zero{background:oklch(0.88 0.02 302);color:var(--muted)}
.badge.bump{animation:bump .4s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.slot .name{
  font-size:11.5px;font-weight:600;color:var(--fg);text-align:center;line-height:1.32;
  max-width:84px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:keep-all
}
.slot.armed .name{color:var(--accent-ink)}
.slot .arm-hint{
  position:absolute;top:-32px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:5;
  background:var(--fg);color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:8px
}
.slot .arm-hint kbd{font-family:var(--mono);background:rgba(255,255,255,.22);border-radius:4px;padding:1px 4px}
.tile.new{background:none;border:2px dashed oklch(0.84 0.045 302);color:var(--muted);box-shadow:none}
.slot:hover .tile.new{border-color:var(--accent);color:var(--accent)}

/* flying dot */
.flyer{position:fixed;z-index:200;width:16px;height:16px;border-radius:50%;
  background:linear-gradient(135deg,#A98CFF,#7B5BE0);box-shadow:0 4px 12px rgba(110,70,215,.55);pointer-events:none}

/* ───────── toolbar / chips ───────── */
.toolbar{display:flex;align-items:flex-start;gap:12px;margin:4px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:7px;flex:1;min-width:0}
.chip{
  height:32px;padding:0 13px;border-radius:999px;background:var(--surface);
  border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--fg);
  display:inline-flex;align-items:center;gap:6px;box-shadow:var(--sh-1);
  transition:transform .14s var(--spring),background .16s,border-color .16s
}
.chip:hover{transform:translateY(-1px);border-color:oklch(0.84 0.06 302)}
.chip .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,#9B7BF0,#7B5BE0);color:#fff;border-color:transparent;
  box-shadow:0 5px 14px -6px rgba(110,70,215,.6)}
.chip[aria-pressed="true"] .n{color:rgba(255,255,255,.78)}
.chip{cursor:pointer;user-select:none}
.chipdel{
  width:18px;height:18px;margin:0 -5px 0 1px;padding:0;border:0;border-radius:50%;
  background:transparent;color:inherit;opacity:0;cursor:pointer;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  transition:opacity .14s,background .14s
}
.chipdel svg{width:11px;height:11px}
.chip:hover .chipdel,.chip:focus-within .chipdel,.chip[aria-pressed="true"] .chipdel{opacity:.6}
.chipdel:hover{opacity:1!important;background:rgba(0,0,0,.10)}
.chip[aria-pressed="true"] .chipdel:hover{background:rgba(255,255,255,.22)}
@media (hover:none){.chipdel{opacity:.55}}
.sortsel{
  height:32px;padding:0 26px 0 11px;border-radius:999px;background:var(--surface);
  border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--fg);
  box-shadow:var(--sh-1);cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat
}
.sortsel:hover{border-color:oklch(0.84 0.06 302)}
.chan{margin:8px 0 4px;padding:9px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)}
.chan-head{margin:0 0 6px;font-size:11.5px;color:var(--muted);font-weight:700;font-family:var(--mono)}
.chan-desc{position:relative}
.chan-desc .clamp{margin:0;font-size:12px;line-height:1.6;color:var(--fg);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.chan-desc.open .clamp{-webkit-line-clamp:unset;display:block}
.chan-desc .more{margin-top:3px;padding:0;border:0;background:none;cursor:pointer;
  font-size:11.5px;font-weight:700;color:var(--accent-ink)}
.chan-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chan-tags span{font-size:10.5px;font-weight:700;color:var(--accent-ink);
  background:var(--accent-soft);border-radius:999px;padding:2px 7px}
.shorts-btn{margin-top:8px}
.shorts-strip{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:4px;scrollbar-width:thin}
.shorts-strip .sh{
  flex:none;width:104px;text-decoration:none;color:inherit;position:relative;
  display:flex;flex-direction:column;gap:3px
}
.shorts-strip .sh img{width:104px;height:139px;object-fit:cover;border-radius:9px;background:var(--border)}
.shorts-strip .sh b{font-size:11px;line-height:1.35;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shorts-strip .sh .n{font-size:10px;color:var(--muted);font-family:var(--mono)}
.shorts-strip .sh .rank{
  position:absolute;left:5px;top:5px;z-index:1;width:18px;height:18px;border-radius:6px;
  background:rgba(28,12,52,.72);color:#fff;font-size:10.5px;font-weight:800;
  display:grid;place-items:center
}
.stats{
  display:flex;flex-wrap:wrap;gap:4px 6px;margin:7px 0 2px
}
.stats .st{
  display:inline-flex;align-items:baseline;gap:4px;padding:3px 7px;border-radius:8px;
  background:var(--surface-2);border:1px solid var(--border);line-height:1
}
.stats .st i{font-style:normal;font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.2px}
.stats .st b{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--fg)}
.stats .st.up{background:oklch(0.95 0.06 150);border-color:oklch(0.88 0.08 150)}
.stats .st.up b{color:oklch(0.45 0.14 150)}
.stats .st.when{background:transparent;border-color:transparent;padding-left:2px}
.stats .st.when b{font-size:11px;color:var(--muted);font-weight:600}
[hidden]{display:none!important}
.offbar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;
  padding:9px 16px;background:oklch(0.95 0.07 65);border-bottom:1px solid oklch(0.86 0.10 65);
  color:oklch(0.42 0.12 55);font-size:12.5px;font-weight:600
}
.offbar .ico{font-size:14px}
.offbar .msg{flex:1;min-width:0}
@media (max-width:560px){.offbar{font-size:11.5px;padding:8px 12px}}
.unsync{
  display:inline-flex;align-items:center;height:16px;padding:0 6px;margin-left:5px;
  border-radius:999px;background:oklch(0.94 0.06 22);color:var(--danger);
  font-size:10px;font-weight:700;letter-spacing:.2px;vertical-align:1px
}
.chip.dropping{
  border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);
  transform:translateY(-2px) scale(1.04);box-shadow:0 8px 18px -8px rgba(110,70,215,.5)
}
.card.dragging{opacity:.45;transform:scale(.97)}
.ghost-btn{
  height:32px;padding:0 13px;border-radius:999px;background:var(--surface);border:1px solid var(--border);
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--sh-1);
  transition:transform .14s var(--spring),color .16s;flex:none
}
.ghost-btn:hover{transform:translateY(-1px);color:var(--accent)}
.ghost-btn svg{width:14px;height:14px}
.ghost-btn[disabled]{opacity:.5;pointer-events:none}
.ghost-btn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ───────── library cards ───────── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.card{
  position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);
  overflow:hidden;box-shadow:var(--sh-1);
  transition:transform .18s var(--spring),box-shadow .2s var(--std),border-color .16s
}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--sh-2)}
.thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(140deg,var(--g1),var(--g2));
  display:grid;place-items:center;overflow:hidden}
.thumb::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.34),transparent 58%)}
.thumb .init{font-size:21px;font-weight:800;color:rgba(255,255,255,.95);letter-spacing:-.035em;
  line-height:1.22;text-shadow:0 2px 10px rgba(40,20,80,.32);z-index:1;word-break:keep-all;
  padding:0 34px 0 14px;text-align:center;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.thumb .ava{
  position:absolute;left:8px;bottom:8px;z-index:2;width:26px;height:26px;border-radius:50%;
  object-fit:cover;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(20,8,40,.35)
}
.linkcard .rt.shot{object-fit:cover}
.thumb .kind{
  position:absolute;right:8px;bottom:8px;z-index:2;
  background:rgba(28,12,52,.62);backdrop-filter:blur(6px);color:#fff;
  font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;
  box-shadow:0 2px 8px rgba(20,8,40,.35)
}
.pick{position:absolute;left:8px;top:8px;z-index:3;width:24px;height:24px;border-radius:8px;
  background:rgba(255,255,255,.92);border:1px solid rgba(70,40,120,.18);display:grid;place-items:center;
  box-shadow:0 2px 6px rgba(30,12,60,.2);cursor:pointer}
.pick svg{width:14px;height:14px;color:#fff;opacity:0}
.pick[aria-pressed="true"]{background:var(--accent);border-color:transparent}
.pick[aria-pressed="true"] svg{opacity:1}
.card-body{padding:12px 13px 13px}
.card-room{font-size:11px;font-weight:700;color:var(--accent-ink);margin-bottom:3px}
.card-title{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.34;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px;min-width:0}
.meta svg{width:13px;height:13px;flex:none;opacity:.75}
.meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .num{font-family:var(--mono);font-size:11.5px}
.card-open{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12.5px;font-weight:700;
  color:var(--accent-ink);text-decoration:none}
.card-open:hover{text-decoration:underline}

/* selection bar */
.selbar{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140%);z-index:90;
  display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-radius:999px;
  background:var(--fg);color:#fff;box-shadow:var(--sh-3);transition:transform .32s var(--spring)
}
.selbar.on{transform:translateX(-50%) translateY(0)}
.selbar .cnt{font-size:13.5px;font-weight:700}
.selbar .cnt b{font-family:var(--mono);color:#D6BCFF}
.selbar button{height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.14);
  font-size:13px;font-weight:700;color:#fff;transition:background .15s}
.selbar button:hover{background:rgba(255,255,255,.26)}
.selbar button.warn:hover{background:var(--danger)}

/* ───────── table (spreadsheet view) ───────── */
.sheet{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface)}
.sheet-scroll{overflow:auto;max-height:min(56vh,460px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:720px;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
th{position:sticky;top:0;background:var(--surface-2);font-size:11.5px;font-weight:700;color:var(--muted);
  letter-spacing:.02em;z-index:1}
tbody tr:hover td{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
td.t{font-weight:600;color:var(--fg)}
td a{color:var(--accent-ink);font-weight:700;text-decoration:none}
td a:hover{text-decoration:underline}

/* ───────── sheets / modal ───────── */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(40,20,75,.34);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .22s var(--std)}
.scrim.on{opacity:1;pointer-events:auto}
.panel{
  width:100%;max-width:860px;max-height:88vh;overflow:auto;background:var(--surface);
  border-radius:var(--r-l);box-shadow:var(--sh-3);transform:translateY(14px) scale(.985);
  transition:transform .28s var(--spring)
}
.scrim.on .panel{transform:none}
.panel.narrow{max-width:430px}
.panel-head{display:flex;align-items:center;gap:14px;padding:20px 22px 16px;position:sticky;top:0;
  background:var(--surface);border-bottom:1px solid var(--border);z-index:2}
.panel-head .tile{width:48px;height:48px;border-radius:15px;cursor:default}
.panel-head .tile svg{width:22px;height:22px}
.panel-title{font-size:19px;font-weight:800;letter-spacing:-.025em}
.panel-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.panel-sub b{font-family:var(--mono);color:var(--accent-ink)}
.x{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);background:var(--surface-2);transition:background .15s,color .15s;flex:none}
.x:hover{background:var(--accent-soft);color:var(--accent-ink)}
.x svg{width:15px;height:15px}
.panel-body{padding:18px 22px 24px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border)}
.seg button{height:30px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;transition:background .16s var(--std),color .16s}
.seg button svg{width:14px;height:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:var(--sh-1)}
.roomtools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.roomtools .grow{flex:1}

/* forms */
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
.input{
  width:100%;height:44px;padding:0 14px;border-radius:var(--r-s);background:var(--surface-2);
  border:1px solid var(--border);font-size:14.5px;font-weight:600;transition:border-color .16s,background .16s
}
.input:focus{outline:none;border-color:var(--accent);background:var(--surface);
  box-shadow:0 0 0 3px var(--accent-soft)}
.input[aria-invalid="true"]{border-color:var(--danger);background:oklch(0.98 0.02 22)}
.help{font-size:11.5px;color:var(--muted);margin-top:6px}
.help.err{color:var(--danger);font-weight:600}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:13px;background:linear-gradient(150deg,var(--g1),var(--g2));
  box-shadow:0 1px 1px rgba(255,255,255,.6) inset,0 4px 10px -5px var(--g2);
  transition:transform .16s var(--spring);position:relative}
.sw:hover{transform:scale(1.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--accent)}
.glyphs{display:flex;gap:9px;flex-wrap:wrap}
.gl{width:38px;height:38px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--muted);transition:transform .16s var(--spring)}
.gl svg{width:19px;height:19px}
.gl:hover{transform:scale(1.06)}
.gl[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.btn{
  height:46px;padding:0 22px;border-radius:999px;font-size:15px;font-weight:700;
  background:linear-gradient(135deg,#9B7BF0,#7B5BE0);color:#fff;
  box-shadow:0 8px 20px -8px rgba(110,70,215,.75);
  transition:transform .16s var(--spring),box-shadow .2s var(--std)
}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px -10px rgba(110,70,215,.85)}
.btn[disabled]{opacity:.55;pointer-events:none;box-shadow:none}
.btn.quiet{background:var(--surface-2);color:var(--fg);border:1px solid var(--border);box-shadow:none}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.warn{background:none;color:var(--danger);box-shadow:none;border:1px solid oklch(0.88 0.06 22)}
.btn.warn:hover{background:oklch(0.97 0.03 22)}
.row-actions{display:flex;gap:10px;align-items:center;margin-top:22px}
.row-actions .push{margin-left:auto}
.switch{width:44px;height:26px;border-radius:999px;background:oklch(0.88 0.02 302);position:relative;
  transition:background .2s var(--std);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(40,20,80,.3);transition:transform .22s var(--spring)}
.switch[aria-pressed="true"]{background:var(--accent)}
.switch[aria-pressed="true"]::after{transform:translateX(18px)}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.setrow:last-of-type{border-bottom:0}
.setrow .t{font-size:14px;font-weight:700}
.setrow label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;letter-spacing:.014em}
.setrow .d{font-size:12px;color:var(--muted);margin-top:2px}
.setrow .right{margin-left:auto;display:flex;align-items:center;gap:8px}

/* 서브탭 임시저장 */
.subseg .div{width:1px;height:20px;background:var(--border);margin:0 5px;align-self:center;flex:none}
.subseg button.inbox .n{background:var(--accent);color:#fff;opacity:1;border-radius:999px;padding:1.5px 6px;margin-left:7px}
.subseg button.inbox .n.zero{background:oklch(0.88 0.02 302);color:var(--muted)}

/* 임시저장 리스트 */
.inbox-list{display:flex;flex-direction:column;gap:10px}
.ibx{display:flex;gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--border);
  border-radius:14px;background:var(--surface-2);transition:border-color .16s,background .16s}
.ibx:hover{border-color:oklch(0.85 0.05 302);background:var(--surface)}
.ibx .rt{width:52px;height:36px;border-radius:10px;background:linear-gradient(140deg,var(--g1),var(--g2));
  flex:none;display:grid;place-items:center;color:#fff}
.ibx .rt svg{width:17px;height:17px}
.ibx .info{flex:1;min-width:0}
.ibx .info h4{font-size:14px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibx .info p{font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-family:var(--mono)}
.ibx .from{font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);
  padding:3px 8px;border-radius:999px;flex:none}
.ibx .acts{display:flex;gap:6px;flex:none}
.ibx .acts .ghost-btn{height:30px;padding:0 11px;font-size:12.5px}
.inbox-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.inbox-head p{font-size:12.5px;color:var(--muted)}
.inbox-head .push{margin-left:auto}

/* 슛 시트 — 방 고르기 */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:13px 4px;
  max-height:212px;overflow:auto;padding:6px 2px 2px}
.pickslot{display:flex;flex-direction:column;align-items:center;gap:6px}
.pickslot .tile{width:50px;height:50px;border-radius:16px;cursor:pointer}
.pickslot .tile svg{width:21px;height:21px}
.pickslot .nm{font-size:10.5px;font-weight:600;text-align:center;line-height:1.3;max-width:72px;
  word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pickslot[aria-pressed="true"] .tile{box-shadow:0 0 0 2.5px var(--surface),0 0 0 5px var(--accent),
  0 8px 18px -8px var(--g2)}
.pickslot[aria-pressed="true"] .nm{color:var(--accent-ink);font-weight:800}
.linkcard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface-2);
  border:1px solid var(--border);margin-bottom:18px}
.linkcard .rt{width:56px;height:38px;border-radius:10px;background:linear-gradient(140deg,var(--g1),var(--g2));
  flex:none;display:grid;place-items:center;color:#fff}
.linkcard .rt svg{width:18px;height:18px}
.linkcard .info{min-width:0;flex:1}
.linkcard .info input{width:100%;background:none;border:0;padding:0;font-size:14.5px;font-weight:700;
  letter-spacing:-.02em}
.linkcard .info input:focus{outline:none}
.linkcard .info p{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.optional{font-weight:600;color:oklch(0.66 0.02 300);font-size:11px;margin-left:5px}
textarea.input{height:auto;min-height:76px;padding:11px 14px;font-weight:500;font-size:14px;
  line-height:1.55;resize:vertical;font-family:inherit}

/* AI픽 */
.aibox{border:1px solid var(--border);border-radius:14px;padding:13px;background:var(--surface-2)}
.aibox.filled{background:linear-gradient(135deg,oklch(0.972 0.03 302),oklch(0.975 0.022 332));
  border-color:oklch(0.885 0.055 302)}
.aibtn{height:40px;padding:0 16px;border-radius:999px;background:var(--surface);
  border:1.5px solid oklch(0.86 0.07 302);color:var(--accent-ink);font-size:13.5px;font-weight:800;
  display:inline-flex;align-items:center;gap:7px;transition:transform .16s var(--spring),box-shadow .18s}
.aibtn:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(110,70,215,.55)}
.aibtn svg{width:15px;height:15px}
.aibtn[disabled]{opacity:.55;pointer-events:none}
.aihead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.aihead .lab{font-size:11.5px;font-weight:800;color:var(--accent-ink);display:flex;align-items:center;gap:5px}
.aihead .lab svg{width:13px;height:13px}
.aitag{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--muted);
  border:1px solid var(--border);border-radius:999px;padding:2px 7px;margin-left:auto;background:var(--surface)}
.aitext{font-size:14px;font-weight:600;line-height:1.55;word-break:keep-all;color:var(--fg)}
.aihint{font-size:11.5px;color:var(--muted);margin-top:7px;word-break:keep-all}
.airow{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap}
.aidots{display:inline-flex;gap:4px}
.aidots i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.35;animation:aid 1s infinite}
.aidots i:nth-child(2){animation-delay:.15s}.aidots i:nth-child(3){animation-delay:.3s}
@keyframes aid{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.card .ai{margin-top:9px;font-size:11.5px;line-height:1.48;color:var(--accent-ink);
  background:var(--accent-soft);border-radius:10px;padding:7px 9px;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .ai b{font-family:var(--mono);font-size:9.5px;font-weight:700;opacity:.75;display:block;margin-bottom:2px}

.picklist{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow:auto;margin:0 -8px}
.pickrow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:12px;
  text-align:left;transition:background .14s}
.pickrow:hover{background:var(--accent-soft)}
.pickrow .tile{width:34px;height:34px;border-radius:11px;flex:none;cursor:pointer}
.pickrow .tile svg{width:17px;height:17px}
.pickrow .pn{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickrow .pg{font-size:11.5px;color:var(--muted);margin-top:1px}
.pickrow .pc{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none}
.pickrow[disabled]{opacity:.45;pointer-events:none}

/* ───────── states ───────── */
.empty{text-align:center;padding:46px 24px;background:var(--surface);border:1px dashed var(--border);
  border-radius:var(--r-m)}
.empty .ico{width:60px;height:60px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent)}
.empty .ico svg{width:26px;height:26px}
.empty h3{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.empty p{font-size:13.5px;color:var(--muted);margin-top:7px;max-width:380px;margin-inline:auto;word-break:keep-all}
.empty .btn{margin-top:18px}
.errbox{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r-m);
  background:oklch(0.98 0.018 22);border:1px solid oklch(0.90 0.05 22)}
.errbox .ico{width:36px;height:36px;border-radius:12px;background:oklch(0.95 0.05 22);color:var(--danger);
  display:grid;place-items:center;flex:none}
.errbox .ico svg{width:18px;height:18px}
.errbox h3{font-size:14.5px;font-weight:800;color:oklch(0.42 0.14 22)}
.errbox p{font-size:13px;color:oklch(0.48 0.08 22);margin-top:4px}
.errbox .ago{font-family:var(--mono);font-size:11px;opacity:.8;margin-top:6px}
.errbox .btn{height:38px;font-size:13.5px;margin-top:12px}
.skel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden}
.skel .bar,.skel .box{background:linear-gradient(90deg,var(--surface-2) 25%,oklch(0.955 0.02 302) 37%,var(--surface-2) 63%);
  background-size:300% 100%;animation:shim 1.25s var(--std) infinite}
.skel .box{aspect-ratio:16/9}
.skel .bar{height:11px;border-radius:6px;margin:10px 13px 0}
.skel .bar.s{width:44%}.skel .bar.m{width:74%}.skel .bar.l{width:90%;height:15px}
.skel .pad{padding-bottom:14px}
@keyframes shim{to{background-position:-300% 0}}
.slow{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px}

/* search */
.searchbox{position:relative;margin-bottom:14px}
.searchbox svg.mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  color:var(--muted);pointer-events:none}
.searchbox input{
  width:100%;height:52px;padding:0 48px;border-radius:999px;background:var(--surface);
  border:1px solid var(--border);font-size:15px;font-weight:600;box-shadow:var(--sh-1);
  transition:border-color .16s,box-shadow .16s
}
.searchbox input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--sh-1)}
.searchbox .clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;
  border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.searchbox .clr svg{width:13px;height:13px}
.recent{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.recent .lab{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}
.reslist{display:flex;flex-direction:column;gap:10px}
.res{display:flex;gap:13px;align-items:center;padding:12px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-m);box-shadow:var(--sh-1);
  transition:transform .16s var(--spring),box-shadow .18s}
.res:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.res .rt{width:58px;height:38px;border-radius:10px;background:linear-gradient(140deg,var(--g1),var(--g2));
  flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px}
.res .info{min-width:0;flex:1}
.res .info h4{font-size:14.5px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .info p{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .where{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);
  padding:4px 9px;border-radius:999px;flex:none}
mark{background:oklch(0.92 0.09 302);color:var(--accent-ink);border-radius:3px;padding:0 1px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140%);z-index:150;
  display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:999px;
  background:var(--fg);color:#fff;font-size:13.5px;font-weight:600;box-shadow:var(--sh-3);
  transition:transform .3s var(--spring);max-width:min(92vw,420px)
}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;flex:none;color:#C9A8FF}
.toast.bad svg{color:oklch(0.78 0.14 22)}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:640px){
  .wrap{padding:0 14px 100px}
  .gear{top:24px}
  .masthead{padding-top:26px}
  .hintbar{flex-direction:column;align-items:flex-start;gap:10px}
  .sources{margin-left:0;width:100%}
  .srcchip{max-width:100%}
  .iconrow{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:14px 6px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .thumb .init{font-size:17px;padding:0 30px 0 10px}
  .scrim{padding:0;align-items:flex-end}
  .panel{max-height:92vh;border-radius:24px 24px 0 0}
  .panel.narrow{max-width:none}
  .selbar{left:14px;right:14px;bottom:14px;transform:translateY(160%);padding:10px}
  .selbar.on{transform:translateY(0)}
  .selbar .cnt{font-size:12.5px}
  .selbar button{padding:0 11px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
  .slot:hover .tile,.card:hover,.res:hover,.tab:hover,.chip:hover{transform:none}
}

/* ═════════ v3 — 덧붙임 · 덮어쓰기 ═════════ */
:root{--side-w:236px;--gold:#C98A0B;--gold-soft:#FFF4DA;--gold-line:#F0D596}

/* ── 앱 뼈대: 모드별 ── */
.app{min-height:100vh}
.side{display:none}
body.m-sidebar .app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr)}
body.m-sidebar .side{display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto;
  padding:22px 14px 18px;border-right:1px solid var(--border);background:var(--surface-2)}
body.m-sidebar .masthead,body.m-sidebar .tabbar{display:none}
body.m-sidebar .wrap{max-width:1180px;padding:26px 30px 120px;margin:0}
.side .brand{display:flex;align-items:center;gap:8px;padding:0 8px}
.side .brand .wordmark{font-size:30px}
.side .brand .ver{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto}
.side .navv{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;height:38px;padding:0 10px;border-radius:11px;
  font-weight:700;font-size:13.5px;color:var(--fg);text-decoration:none;transition:background .15s}
.navbtn svg{width:17px;height:17px;flex:none;opacity:.75}
.navbtn:hover{background:var(--accent-soft)}
.navbtn[aria-current="page"]{background:linear-gradient(135deg,#9B7BF0,#7B5BE0);color:#fff;box-shadow:0 6px 16px -8px rgba(110,70,215,.7)}
.navbtn[aria-current="page"] svg{opacity:1}
.navbtn .ext{margin-left:auto;width:12px;height:12px;opacity:.5}
.side .sep{height:1px;background:var(--border);margin:2px 6px}
.side .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);padding:0 10px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}

/* ── 그룹 목록 (세로: 사이드바 / 가로: 탭 줄) ── */
.glist{display:flex;gap:3px}
.glist.v{flex-direction:column}
.glist.h{align-items:center;padding:4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none}
.glist.h::-webkit-scrollbar{display:none}
.gitem{position:relative;display:flex;align-items:center;flex:none}
.glist.v .gitem{width:100%}
.gbtn{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:10px;font-weight:700;
  font-size:13.5px;color:var(--muted);white-space:nowrap;width:100%;text-align:left;transition:background .15s,color .15s}
.gbtn svg{width:15px;height:15px;flex:none}
.gbtn .n{font-family:var(--mono);font-size:11px;font-weight:600;opacity:.75;margin-left:auto;padding-left:8px}
.glist.h .gbtn .n{margin-left:2px}
.gbtn:hover{color:var(--accent-ink);background:var(--accent-soft)}
.gbtn[aria-selected="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:var(--sh-1)}
.glist.v .gbtn[aria-selected="true"]{background:var(--accent-soft)}
.gbtn.fav{color:var(--gold)}
.gbtn.fav[aria-selected="true"]{background:var(--gold-soft);color:#8A5A00;box-shadow:inset 0 0 0 1px var(--gold-line)}
.gbtn .gname[contenteditable="true"]{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px;
  background:var(--surface);color:var(--fg);padding:0 4px;min-width:40px;cursor:text}
.gdel{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;
  display:none;place-items:center;color:var(--muted);background:var(--surface-2)}
.gdel svg{width:11px;height:11px}
.gdel:hover{color:#fff;background:var(--danger)}
.glist.h .gdel{top:-6px;right:-6px;transform:none;box-shadow:var(--sh-1);background:var(--surface)}
.gitem.sel .gdel{display:grid}
.glist.v .gitem.sel .gbtn .n{visibility:hidden}
.gsep{width:1px;height:20px;background:var(--border);margin:0 4px;flex:none}
.glist.v .gsep{width:auto;height:1px;margin:4px 8px}
.gadd{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:10px;color:var(--accent-ink);
  font-weight:700;font-size:13px;flex:none}
.gadd svg{width:15px;height:15px}
.gadd:hover{background:var(--accent-soft)}
.glist.h .gadd{width:34px;justify-content:center;padding:0;border:1.5px dashed oklch(0.82 0.06 302);margin-left:auto}
.gnew{height:34px;border-radius:10px;border:1.5px solid var(--accent);padding:0 10px;font-weight:700;font-size:13px;
  background:var(--surface);min-width:120px}
.gnew:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.drop-on{box-shadow:0 0 0 2px var(--accent)!important;background:var(--accent-soft)!important;color:var(--accent-ink)!important}
.gbtn.fav.drop-on{box-shadow:0 0 0 2px var(--gold)!important;background:var(--gold-soft)!important}

/* ── 슛하기 머리 ── */
.shead{display:flex;align-items:center;gap:12px;margin:2px 0 20px;flex-wrap:wrap}
.shead h2{font-size:24px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.shead h2 .gname{border-radius:6px;padding:0 3px;cursor:text}
.shead h2 .gname:hover{background:var(--accent-soft)}
.shead h2 .gname[contenteditable="true"]{outline:2px solid var(--accent);background:var(--surface)}
.shead .meta2{font-size:12.5px;color:var(--muted)}
.hint2{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:18px}
.hint2 b{color:var(--fg);font-weight:700}
.hint2 kbd,.kbd{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent-ink);border-radius:5px;padding:1px 5px;font-weight:600}
body.m-sidebar .iconrow{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:26px 10px}
body.m-sidebar .iconrow .tile{width:84px;height:84px;border-radius:26px}
body.m-sidebar .iconrow .tile svg{width:36px;height:36px}
body.m-sidebar .slot .name{max-width:100px;font-size:12.5px}

/* 방 타일 — 별 · 끌기 */
.slot{touch-action:manipulation}
.slot .star{position:absolute;top:-8px;left:2px;z-index:4;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;font-size:13px;line-height:1;background:var(--surface);color:oklch(0.78 0.02 300);
  border:1px solid var(--border);box-shadow:var(--sh-1);opacity:0;transition:opacity .15s}
.slot:hover .star,.slot:focus-within .star,.slot .star[aria-pressed="true"]{opacity:1}
.slot .star[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
@media (hover:none){.slot .star{opacity:.8}}
.slot .gtag{font-size:10.5px;color:var(--muted);margin-top:-5px}
.slot.busy .tile{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.94);opacity:.7}}
.drag-ghost{position:fixed;z-index:300;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) scale(1.06);
  filter:drop-shadow(0 12px 22px rgba(60,30,110,.35))}
.dragging-src{opacity:.25}
.drop-mark{outline:2.5px dashed var(--accent);outline-offset:4px;border-radius:14px}

/* 즐겨찾기 빈 상태 */
.favempty{border:1.5px dashed var(--gold-line);background:var(--gold-soft);border-radius:var(--r-m);padding:22px;color:#7A5200;font-size:13.5px}
.favempty b{color:#5E3F00}

/* ── 칸반 모드 ── */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-2);border:1px solid var(--border);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:200px}
.kcol .khead{display:flex;align-items:center;gap:6px;padding:4px 6px 6px;font-weight:800;font-size:13.5px}
.kcol .khead .n{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600}
.krow{display:flex;align-items:center;gap:9px;padding:8px;border-radius:12px;background:var(--surface);border:1px solid var(--border);
  font-size:13px;font-weight:700;text-align:left;width:100%}
.krow .tile{width:30px;height:30px;border-radius:9px;box-shadow:none}
.krow .tile svg{width:15px;height:15px}
.krow .tile .badge{display:none}
.krow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow .c{font-family:var(--mono);font-size:11px;color:var(--muted)}
.krow .st{color:var(--gold);font-size:12px}
.kempty{border:1.5px dashed var(--border);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:12px}

/* ── 리스트 모드 ── */
.rlist{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden}
.rrow{display:grid;grid-template-columns:40px minmax(0,1.6fr) 70px 110px minmax(0,1fr) 70px;align-items:center;gap:10px;
  padding:9px 14px;border-bottom:1px solid var(--border);width:100%;text-align:left;font-size:13px}
.rrow:last-child{border-bottom:0}
.rrow.head{font-size:11px;color:var(--muted);font-weight:700;background:var(--surface-2)}
.rrow:not(.head):hover{background:var(--accent-soft)}
.rrow .tile{width:30px;height:30px;border-radius:9px;box-shadow:none}
.rrow .tile svg{width:15px;height:15px}
.rrow .tile .badge{display:none}
.rrow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .num{font-family:var(--mono);text-align:right}
@media (max-width:640px){.rrow{grid-template-columns:34px minmax(0,1fr) 50px 60px}.rrow .hide-s{display:none}}

/* ── 코트 모드 ── */
.court{position:relative;border-radius:28px;min-height:520px;background:radial-gradient(420px 220px at 50% 108%,#F3E2CF 0,#F3E2CF 60%,transparent 61%),#FBF7F1;
  border:1px solid #EFE3D2;padding:28px 20px 150px;display:flex;flex-wrap:wrap;justify-content:center;gap:26px 18px}
.court .slot{width:120px}
.court .rim{width:88px;height:9px;border-radius:999px;background:#F5806A;box-shadow:0 3px 0 #C9553F}
.court .net{width:70px;height:34px;margin-top:-10px;border-radius:0 0 22px 22px;border:2px dashed #D8C8B4;border-top:0}
.court .ball{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:min(560px,92%)}
.court .ballbody{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFB27A,#E0662A);box-shadow:0 10px 20px -8px rgba(160,70,20,.6)}
.court .clip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #EFE3D2;border-radius:12px;padding:7px 12px;font-size:12.5px;max-width:100%}
.court .clip .u{font-family:var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 방 화면 도구 ── */
.roomtools .seg button .n{font-family:var(--mono);font-size:10.5px;opacity:.7}
.chipbtn{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.chipbtn[aria-pressed="true"]{background:#FFF1DC;border-color:#F0C98A;color:#8A4B00}
.chipbtn svg{width:13px;height:13px}
.starbig{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;border:1px solid var(--border);color:oklch(0.75 0.02 300);background:var(--surface)}
.starbig[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.noreason{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:#FFF1DC;color:#8A4B00;font-size:10.5px;font-weight:800}
.opinion{margin-top:8px}
.opinion textarea{width:100%;min-height:64px;border-radius:10px;border:1.5px solid var(--accent);padding:8px 10px;font:inherit;font-size:13px;resize:vertical}
.opinion .row{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.opbtn{height:26px;padding:0 9px;border-radius:8px;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);display:inline-flex;align-items:center;gap:4px}
.opbtn svg{width:12px;height:12px}
.opbtn.pri{background:var(--accent);color:#fff}
.cardfoot{display:flex;align-items:center;gap:8px;margin-top:10px}
.cardfoot .card-open{margin-top:0}
.cardfoot .opbtn{margin-left:auto}
.ccode{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;background:var(--fg);color:#fff;letter-spacing:.04em}
.ccode.guess{background:transparent;color:var(--muted);border:1px dashed var(--muted)}

/* 시트 보기 — 칸 수정 */
td.ed{cursor:text}
td.ed:hover{box-shadow:inset 0 0 0 1px oklch(0.85 0.06 302)}
td.editing{padding:4px 6px;overflow:visible}
td.editing input{width:100%;min-width:140px;height:30px;border-radius:6px;border:2px solid var(--accent);padding:0 7px;font:inherit;font-size:13px;background:#fff}
.lock{width:10px;height:10px;opacity:.55;vertical-align:-1px;margin-left:3px}
.savestate{font-size:11.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.savestate.ok{color:oklch(0.45 0.14 150)}
.savestate.bad{color:var(--danger)}
.sheethelp{font-size:11.5px;color:var(--muted);margin-top:8px}

/* ── 보관함 트리 ── */
.libtools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.libtools .grow{flex:1}
.libq{height:34px;width:220px;border-radius:999px;border:1px solid var(--border);background:var(--surface);padding:0 14px;font-size:13px;font-weight:600}
.tree{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:10px 12px;box-shadow:var(--sh-1)}
.tnode{display:flex;align-items:center;gap:8px;width:100%;padding:7px 6px;border-radius:9px;text-align:left;font-weight:800;font-size:14px}
.tnode:hover{background:var(--surface-2)}
.tnode svg.chev{width:14px;height:14px;color:var(--muted);transition:transform .15s}
.tnode[aria-expanded="false"] svg.chev{transform:rotate(-90deg)}
.tnode .n{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600}
.tnode.k2{font-size:13px;padding-left:28px}
.tkids{padding-left:52px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px;padding-bottom:8px}
.rline{display:flex;align-items:center;gap:9px;padding:7px 8px 7px 11px;border:1px solid var(--border);border-radius:11px;background:var(--surface);font-size:13px}
.rline .dot{width:10px;height:10px;border-radius:50%;flex:none}
.rline b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rline .g{font-size:11px;color:var(--muted);white-space:nowrap}
.rline .c{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rline .sp{flex:1}
.rline .mini{height:26px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink)}
.rline .mini.del{background:transparent;color:var(--muted);padding:0 6px}
.rline .mini.del:hover{color:var(--danger);background:oklch(0.97 0.03 22)}
.rline .mini svg{width:13px;height:13px}
.secthead{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-weight:800}
.secthead .line{flex:1;height:1px;background:var(--border)}
.secthead .n{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600}
.subhead{font-size:12.5px;font-weight:800;color:var(--muted);margin:10px 0 8px}
.roomtag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px 2px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border)}
.roomtag .dot{width:8px;height:8px;border-radius:50%}

/* ── 레퍼찾기: 필터 ── */
.findgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
.facets{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:12px}
.facet h4{font-size:11.5px;color:var(--muted);font-weight:800;margin-bottom:6px}
.fopt{display:flex;align-items:center;gap:8px;width:100%;padding:4px 2px;font-size:13px;text-align:left;border-radius:6px}
.fopt:hover{background:var(--surface-2)}
.fopt .box{width:16px;height:16px;border-radius:5px;border:1.5px solid oklch(0.82 0.04 302);flex:none;display:grid;place-items:center}
.fopt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.fopt[aria-pressed="true"] .box::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.fopt .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.fopt .dot{width:8px;height:8px;border-radius:50%;flex:none}
.facts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fchip{height:26px;padding:0 6px 0 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.fchip svg{width:11px;height:11px}
.ftoggle{display:none}
@media (max-width:760px){
  .findgrid{grid-template-columns:1fr}
  .facets{position:static;display:none}
  .facets.open{display:flex}
  .ftoggle{display:inline-flex}
}

/* ── 오늘급상승 ── */
.rtools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.crit{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.crit .c{height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);display:inline-flex;align-items:center}
.crit .c.k{background:var(--fg);color:#fff}
.rlistx{display:flex;flex-direction:column;gap:8px}
.rx{display:grid;grid-template-columns:24px 46px minmax(0,1fr) 130px 150px 70px;gap:12px;align-items:center;padding:10px 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;text-align:left;width:100%}
.rx:hover{box-shadow:var(--sh-1)}
.rx .rk{font-family:var(--mono);font-weight:800;color:var(--muted);text-align:center}
.rx .th{width:46px;height:46px;border-radius:12px;object-fit:cover;background:linear-gradient(140deg,var(--g1),var(--g2))}
.rx .th.ch{border-radius:50%}
.rx .tt{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rx .sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.rx .sub .dot{width:8px;height:8px;border-radius:50%}
.rx .gain{text-align:right}
.rx .gain b{font-family:var(--mono);font-size:13px}
.rx .gain span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.rx .mx{font-family:var(--mono);font-weight:800;font-size:16px;color:#C2410C;text-align:right}
.rx.cold .mx{color:var(--muted)}
.rx svg.spark{width:130px;height:34px}
@media (max-width:760px){.rx{grid-template-columns:22px 40px minmax(0,1fr) 60px}.rx .hide-s{display:none}}
.state{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:22px;display:flex;gap:16px;align-items:flex-start}
.state .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.state .ico svg{width:22px;height:22px}
.state h3{font-size:16px;font-weight:800}
.state p{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.6}
.state .btn{margin-top:12px;height:40px;font-size:14px}
.warnbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:#FFF6E3;border:1px solid var(--gold-line);font-size:12.5px;color:#7A5200}
details.more{margin-top:14px}
details.more summary{cursor:pointer;font-weight:800;font-size:13px;color:var(--muted);padding:6px 0}

/* ── 설정: 모드 고르기 · 버전 기록 ── */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:10px}
.modecard{border:1.5px solid var(--border);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface)}
.modecard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.modecard b{font-size:12.5px}
.modecard span{font-size:10.5px;color:var(--muted);line-height:1.35}
.mini-prev{height:56px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);position:relative;overflow:hidden}
.mini-prev i{position:absolute;background:oklch(0.86 0.06 302);border-radius:3px}
.numrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.numrow label{font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.numrow input{height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);padding:0 10px;font:inherit;font-weight:700;font-size:14px}
.chlog{display:flex;flex-direction:column;gap:14px}
.chlog .v{display:flex;gap:10px;align-items:baseline}
.chlog .v b{font-family:var(--mono);font-size:13px;color:var(--accent-ink)}
.chlog .v span{font-size:11.5px;color:var(--muted)}
.chlog ul{margin:6px 0 0;padding-left:18px;list-style:disc;font-size:13px;line-height:1.7}

function byOrder(a,b){
  const x = a.order ?? 1e6, y = b.order ?? 1e6;
  return x - y || String(a.since||'').localeCompare(String(b.since||''));
}
const isContent = r => r.kind !== '채널';
const noReason = r => !r.note || r.note === '메모 없음';
const fmt = n => n == null || n === '' ? '—' : Number(n).toLocaleString('ko-KR');
const fmtShort = n => {
  const v = Number(n);
  if(!isFinite(v) || n == null || n === '') return '—';
  if(v >= 100000000) return (v/100000000).toFixed(v >= 1000000000 ? 0 : 1).replace(/\.0$/,'') + '억';
  if(v >= 10000) return (v/10000).toFixed(v >= 100000 ? 0 : 1).replace(/\.0$/,'') + '만';
  return v.toLocaleString('ko-KR');
};
const fmtDur = sec => {
  const v = Number(sec); if(!v || !isFinite(v)) return '';
  const h = Math.floor(v/3600), m = Math.floor(v%3600/60), s2 = Math.floor(v%60);
  return (h ? h + ':' + String(m).padStart(2,'0') : String(m)) + ':' + String(s2).padStart(2,'0');
};
const fmtAgo = iso => {
  if(!iso) return '';
  const t = new Date(String(iso).replace(' ','T'));
  if(isNaN(t)) return '';
  const h = (Date.now() - t) / 3600000;
  if(h < 1) return '방금';
  if(h < 24) return Math.floor(h) + '시간 전';
  const d = Math.floor(h/24);
  if(d < 31) return d + '일 전';
  if(d < 365) return Math.floor(d/30) + '개월 전';
  return Math.floor(d/365) + '년 전';
};

/* ── 링크 ── */
const URL_RE = /^(https?:\/\/|www\.)[^\s]+$/i;
function hostOf(u){ try{ return (u.startsWith('http') ? new URL(u) : new URL('https://'+u)).hostname.replace(/^www\./,''); }catch{ return '알 수 없음'; } }
function kindOf(u){ if(/shorts/.test(u)) return '쇼츠'; if(/youtu/.test(u)) return '영상'; if(/instagram/.test(u)) return '인스타'; return '아티클'; }
function titleFromUrl(u){
  const handle = String(u).match(/youtube\.com\/(@[\w.%-]+)/);
  if(handle){ try{ return decodeURIComponent(handle[1]); }catch{ return handle[1]; } }
  return hostOf(u) + ' 링크';
}
const ytId = u => (String(u).match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/live\/)([\w-]{11})/)||[])[1] || '';
/* 글 덩어리에서 링크만 — vidIQ outliers 링크는 유튜브 주소로 바꾸고 같은 영상이면 합친다 */
function extractLinks(text){
  const raw = String(text||'').match(/https?:\/\/[^\s<>"'`]+/g) || [];
  const out = [], byKey = new Map();
  let merged = 0;
  raw.forEach(u0 => {
    let u = u0.replace(/[),.;]+$/,''), note = '', key = u;
    if(/^https?:\/\/(app\.)?vidiq\.com\//i.test(u)){
      let vid = '', score = '', short = true;
      try{
        const U = new URL(u);
        vid = U.searchParams.get('video_id') || '';
        score = U.searchParams.get('outlier_score') || '';
        const f = U.searchParams.get('filters');
        if(f){ try{ short = (JSON.parse(f).mode || 'short') === 'short'; }catch{} }
      }catch{}
      if(vid){
        u = short ? `https://www.youtube.com/shorts/${vid}` : `https://www.youtube.com/watch?v=${vid}`;
        key = 'yt:' + vid;
      }
      note = score ? `vidIQ 아웃라이어 ${Number(score).toFixed(2)}×` : 'vidIQ';
    }else{
      const vid = ytId(u);
      if(vid) key = 'yt:' + vid;
    }
    if(byKey.has(key)){
      const it = byKey.get(key);
      if(note && !it.note) it.note = note;
      merged++;
      return;
    }
    const it = {url:u, note};
    byKey.set(key, it); out.push(it);
  });
  out.lines = raw.length; out.merged = merged;
  return out;
}

/* ── 서버 호출 — 구글이 가끔 HTML 오류 페이지를 주면 한 번 더 ── */
async function api(action, payload, opt){
  if(!connected()) throw new Error('시트 연결 전이에요 — ⚙ 설정에서 연결해 주세요');
  const retry = (opt && opt.retry != null) ? opt.retry : 1;
  let last;
  for(let i = 0; i <= retry; i++){
    try{
      const r = await fetch(CFG.apiUrl, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(Object.assign({action}, payload || {}))
      });
      const txt = await r.text();
      let j;
      try{ j = JSON.parse(txt); }catch{ throw new Error('서버가 알 수 없는 답을 줬어요 (' + r.status + ')'); }
      if(!j.ok){ const e = new Error(j.error || '실패했어요'); e.fatal = true; throw e; }
      return j;
    }catch(e){
      last = e;
      if(e.fatal) break;
      if(i < retry) await sleep(800);
    }
  }
  throw last;
}

let toastT;
const TOAST_ICO = {
  ok: ICONS.shoot.replace('<svg','<svg style="width:16px;height:16px"'),
  bad: ICONS.warn.replace('<svg','<svg style="width:16px;height:16px"')
};
function toast(msg, bad, action, ms){
  const el = $('#toast');
  $('#toast-ico').innerHTML = bad ? TOAST_ICO.bad : TOAST_ICO.ok;
  $('#toast-msg').textContent = bad ? '문제 발생 — ' + msg : msg;
  const act = $('#toast-act');
  act.hidden = !action;
  act.onclick = null;
  if(action){
    act.textContent = action.label;
    act.onclick = () => { el.classList.remove('on'); action.fn(); };
  }
  el.classList.toggle('bad', !!bad);
  el.classList.add('on');
  el.dataset.ms = String(ms || (action ? 10000 : 3800));
  armToastTimer();
}
function armToastTimer(){
  clearTimeout(toastT);
  const el = $('#toast');
  const ms = Number(el.dataset.ms) || 3800;
  if(ms < 0) return;          /* 진행 중 알림 — 직접 닫힐 때까지 */
  toastT = setTimeout(()=>el.classList.remove('on'), ms);
}
(function toastPause(){
  const el = $('#toast');
  ['mouseenter','focusin'].forEach(ev => el.addEventListener(ev, ()=>clearTimeout(toastT)));
  ['mouseleave','focusout'].forEach(ev => el.addEventListener(ev, ()=>{ if(el.classList.contains('on')) armToastTimer(); }));
})();

/* ── 되돌리기 스택 (⌘Z) ── */
const UNDO = [];
function pushUndo(label, fn, msg){
  UNDO.push({label, fn});
  if(UNDO.length > 40) UNDO.shift();
  toast(msg || label, false, {label:'되돌리기', fn:runUndo});
}
async function runUndo(){
  const u = UNDO.pop();
  if(!u){ toast('되돌릴 게 없어요'); return; }
  try{
    toast('되돌리는 중… ' + u.label, false, null, -1);
    await u.fn();
    toast('되돌렸어요 — ' + u.label);
  }catch(e){
    toast('되돌리기 실패 — ' + (e.message || e) + ' · 설정 › 휴지통에서 다시 시도할 수 있어요', true);
  }
}
document.addEventListener('keydown', e => {
  if(!(e.metaKey || e.ctrlKey) || e.shiftKey || e.key.toLowerCase() !== 'z') return;
  if(e.target.closest && e.target.closest('input,textarea,[contenteditable="true"]')) return;
  e.preventDefault();

});

/* ═══════ 끌기(포인터) — 순서 바꾸기 · 즐겨찾기/그룹에 놓기 ═══════ */
const DRAG = {cur:null, justEnded:0};
document.addEventListener('touchmove', e => { if(DRAG.cur) e.preventDefault(); }, {passive:false});
document.addEventListener('click', e => {
  if(Date.now() - DRAG.justEnded < 350){ e.stopPropagation(); e.preventDefault(); }
}, true);
/* opts: {sortSel: 같은 부모 안에서 순서를 바꿀 형제 선택자, onReorder(ids), onDrop(target) → true면 처리됨, accept(target)} */
function draggable(el, opts){
  el.addEventListener('pointerdown', e => {
    if(e.button !== 0) return;
    if(e.target.closest('.star,.gdel,[contenteditable="true"],input,textarea,select,a')) return;
    const touch = e.pointerType !== 'mouse';
    const st = {x:e.clientX, y:e.clientY, id:e.pointerId, started:false, timer:null};
    const begin = ev => {
      st.started = true;
      const r = el.getBoundingClientRect();
      const ghost = el.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.style.width = r.width + 'px';
      ghost.style.left = (ev || e).clientX + 'px';
      ghost.style.top = (ev || e).clientY + 'px';
      document.body.appendChild(ghost);
      el.classList.add('dragging-src');
      DRAG.cur = {el, opts, ghost, over:null, moved:false, startIndex: siblings().indexOf(el)};
    };
    const siblings = () => opts.sortSel ? $$(opts.sortSel, el.parentElement) : [];
    if(touch) st.timer = setTimeout(() => begin(), 320);
    const move = ev => {
      if(ev.pointerId !== st.id) return;
      const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
      if(!st.started){
        if(touch){ if(Math.hypot(dx,dy) > 9){ clearTimeout(st.timer); cleanup(); } return; }
        if(Math.hypot(dx,dy) < 7) return;
        begin(ev);
      }
      const D = DRAG.cur; if(!D) return;
      D.ghost.style.left = ev.clientX + 'px';
      D.ghost.style.top = ev.clientY + 'px';
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      /* 놓을 곳 표시 */
      let tgt = under && under.closest('[data-drop]');
      if(tgt && opts.accept && !opts.accept(tgt)) tgt = null;
      if(D.over !== tgt){ D.over?.classList.remove('drop-on'); D.over = tgt; tgt?.classList.add('drop-on'); }
      /* 형제 사이 순서 */
      if(!tgt && opts.sortSel){
        const sib = under && under.closest(opts.sortSel);
        if(sib && sib !== el && sib.parentElement === el.parentElement){
          const rr = sib.getBoundingClientRect();
          const horiz = opts.axis !== 'y';
          const after = horiz ? (ev.clientX > rr.left + rr.width/2) : (ev.clientY > rr.top + rr.height/2);
          if(after) sib.after(el); else sib.before(el);
          D.moved = true;
        }
      }
    };
    const up = ev => {
      if(ev.pointerId !== st.id) return;
      clearTimeout(st.timer);
      cleanup();
      const D = DRAG.cur;
      if(!st.started || !D) return;
      D.ghost.remove();
      el.classList.remove('dragging-src');
      D.over?.classList.remove('drop-on');
      DRAG.cur = null;
      DRAG.justEnded = Date.now();
      if(D.over && opts.onDrop){ opts.onDrop(D.over); return; }
      if(D.moved && opts.onReorder){
        const ids = siblings().map(x => x.dataset.id).filter(Boolean);
        opts.onReorder(ids);
      }
    };
    const cleanup = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}

/* ═══════ 그룹 목록 (★ · 그룹들 · 임시저장 · ＋) ═══════ */
function groupCount(g){
  if(g === 'fav'){ const r = favRooms(); return {rooms:r.length, refs:r.reduce((a,x)=>a+x.refs.length,0)}; }
  if(g === 'inbox') return {rooms:0, refs:INBOX.length};
  const rooms = roomsIn(g);
  return {rooms:rooms.length, refs:rooms.reduce((a,r)=>a+r.refs.length,0)};
}
function currentGroup(){
  if(S.group === 'fav' || S.group === 'inbox') return S.group;
  if(groupOf(S.group)) return S.group;
  S.group = favRooms().length ? 'fav' : (GROUPS[0] ? GROUPS[0].id : 'inbox');
  return S.group;
}
function groupListHTML(dir){
  const cur = currentGroup();
  const item = (id, label, cls, n, extra) => `
    <div class="gitem ${id===cur?'sel':''}" data-id="${esc(id)}" ${extra||''}>
      <button class="gbtn ${cls||''}" role="tab" data-g="${esc(id)}" aria-selected="${id===cur}" ${id!=='fav'&&id!=='inbox'?`data-drop="group:${esc(id)}"`:''} ${id==='fav'?'data-drop="fav"':''}>
        ${cls==='fav' ? '<span aria-hidden="true">★</span>' : id==='inbox' ? ICONS.inbox : ''}
        <span class="gname">${esc(label)}</span><span class="n">${n}</span>
      </button>
      ${id!=='fav' && id!=='inbox' ? `<button class="gdel" data-gdel="${esc(id)}" aria-label="${esc(label)} 그룹 지우기" title="그룹 지우기 (되돌리기 가능)">${ICONS.x}</button>` : ''}
    </div>`;
  return `<div class="glist ${dir}" role="tablist" aria-label="그룹" aria-orientation="${dir==='v'?'vertical':'horizontal'}">
    ${item('fav', '즐겨찾기', 'fav', groupCount('fav').rooms)}
    <span class="gsep" aria-hidden="true"></span>
    ${GROUPS.map(g => item(g.id, g.name, '', groupCount(g.id).refs, 'data-sortable="g"')).join('')}
    <span class="gsep" aria-hidden="true"></span>
    ${item('inbox', '임시저장', '', INBOX.length)}
    <button class="gadd" data-gadd aria-label="새 그룹 만들기" title="새 그룹">${ICONS.plus}${dir==='v'?'새 그룹':''}</button>
  </div>`;
}
function bindGroupList(scope){
  const list = $('.glist', scope);
  if(!list) return;
  const vertical = list.classList.contains('v');
  $$('.gbtn', list).forEach(b => {
    b.addEventListener('click', e => {
      const id = b.dataset.g;
      if(id === currentGroup() && id !== 'fav' && id !== 'inbox'){ startRenameGroup(b.querySelector('.gname'), id); return; }
      setGroup(id);
    });
    b.addEventListener('keydown', e => {
      const id = b.dataset.g;
      if(id === 'fav' || id === 'inbox') return;
      if(e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown')){
        e.preventDefault(); e.stopPropagation();
        moveGroup(id, (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ? -1 : 1);
      }else if(e.key === 'F2'){ e.preventDefault(); startRenameGroup(b.querySelector('.gname'), id); }
      else if((e.key === 'Delete' || e.key === 'Backspace') && !e.target.isContentEditable){ e.preventDefault(); deleteGroup(id); }
    });
  });
  $$('[data-gdel]', list).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); deleteGroup(b.dataset.gdel); }));
  $('[data-gadd]', list)?.addEventListener('click', () => startAddGroup(list));
  $$('.gitem[data-sortable="g"]', list).forEach(it => draggable(it, {
    sortSel:'.gitem[data-sortable="g"]', axis: vertical ? 'y' : 'x',
    accept: () => false,
    onReorder(ids){ reorderGroups(ids); }
  }));
}
function setGroup(g){
  if(S.group === g) return;
  S.group = g; saveState();
  if(S.settings.mode === 'sidebar') renderChrome();
  setTab('shoot');
}

function startRenameGroup(span, id){
  if(!span || span.isContentEditable) return;
  const g = groupOf(id); if(!g) return;
  const old = g.name;
  span.contentEditable = 'true';
  span.focus();
  const sel = getSelection(); const rg = document.createRange(); rg.selectNodeContents(span); sel.removeAllRanges(); sel.addRange(rg);
  let done = false;
  const finish = async (save) => {
    if(done) return; done = true;
    span.contentEditable = 'false';
    const name = span.textContent.replace(/\s+/g,' ').trim().slice(0, 20);
    if(!save || !name || name === old){ span.textContent = old; return; }
    if(GROUPS.some(x => x.name === name && x.id !== id)){ span.textContent = old; toast('같은 이름의 그룹이 있어요', true); return; }
    await renameGroup(id, name, old, true);
  };
  span.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); finish(false); }
    e.stopPropagation();
  });
  span.addEventListener('blur', () => finish(true), {once:true});
}
async function renameGroup(id, name, old, withUndo){
  const g = groupOf(id); if(!g) return;
  g.name = name; saveState(); renderAllGroups();
  if(connected()){
    try{ await api('groupRename', {id, name}); }
    catch(e){ g.name = old; saveState(); renderAllGroups(); toast('그룹 이름을 못 바꿨어요 — ' + e.message, true); return; }
  }
  if(withUndo) pushUndo(`그룹 이름 「${old}」→「${name}」`, () => renameGroup(id, old, name, false), `그룹 이름을 「${name}」(으)로 바꿨어요 — 시트 탭 이름도 같이`);
}
function startAddGroup(list){
  if($('.gnew', list)) return $('.gnew', list).focus();
  const inp = document.createElement('input');
  inp.className = 'gnew'; inp.placeholder = '새 그룹 이름'; inp.maxLength = 20;
  inp.setAttribute('aria-label','새 그룹 이름');
  $('[data-gadd]', list).before(inp);
  inp.focus();
  let done = false;
  const finish = async save => {
    if(done) return; done = true;
    const name = inp.value.trim();
    inp.remove();
    if(!save || !name) return;
    if(GROUPS.some(x => x.name === name)){ toast('같은 이름의 그룹이 있어요', true); return; }
    await addGroup(name);
  };
  inp.addEventListener('keydown', e => { e.stopPropagation(); if(e.key === 'Enter') finish(true); if(e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
}
async function addGroup(name){
  let g = {id:'local-' + nid('g'), name};
  if(connected()){
    try{ const j = await api('groupAdd', {name}); g = j.group; }
    catch(e){ toast('그룹을 못 만들었어요 — ' + e.message, true); return; }
  }
  GROUPS.push(g); S.group = g.id; saveState(); renderAllGroups(); renderShoot();
  pushUndo(`그룹 「${name}」 만들기`, async () => { await deleteGroup(g.id, {silent:true, noUndo:true}); }, `「${name}」 그룹을 만들었어요 — 시트에도 같은 이름의 탭이 생겼어요`);
}
async function deleteGroup(id, opt){
  const g = groupOf(id); if(!g) return;
  if(GROUPS.length <= 1){ toast('그룹은 하나는 남아 있어야 해요', true); return; }
  const c = groupCount(id);
  const run = async () => {
    let batch = null;
    if(connected()){
      try{ batch = (await api('groupDelete', {id})).batch; }
      catch(e){ toast('그룹을 못 지웠어요 — ' + e.message, true); return; }
    }
    const keep = {group:g, idx:GROUPS.indexOf(g), rooms:ROOMS.filter(r => r.g === id)};
    GROUPS = GROUPS.filter(x => x.id !== id);
    ROOMS = ROOMS.filter(r => r.g !== id);
    if(S.group === id) S.group = null;
    saveState(); renderAllGroups(); renderShoot();
    if(opt && opt.noUndo) return;
    pushUndo(`그룹 「${g.name}」 지우기`, async () => {
      if(batch) await api('restore', {batch});
      GROUPS.splice(Math.min(keep.idx, GROUPS.length), 0, keep.group);
      ROOMS.push(...keep.rooms);
      saveState(); renderAllGroups(); renderShoot();
      if(batch) syncNow({quiet:true});
    }, `「${g.name}」 그룹을 휴지통으로 옮겼어요 (방 ${c.rooms} · 레퍼 ${c.refs})`);
  };
  if(opt && opt.silent) return run();
  if(!c.rooms && !c.refs) return run();
  askConfirm({
    title:`「${g.name}」 그룹을 지울까요?`,
    desc:`방 ${c.rooms}개 · 레퍼 ${c.refs}개가 함께 휴지통으로 가요. 알림의 [되돌리기]나 ${MOD}Z로 그대로 돌아와요.`,
    ok:'휴지통으로', danger:true, onOk:run
  });
}
function moveGroup(id, dir){
  const i = GROUPS.findIndex(g => g.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= GROUPS.length) return;
  const ids = GROUPS.map(g => g.id);
  [ids[i], ids[j]] = [ids[j], ids[i]];
  reorderGroups(ids);
  requestAnimationFrame(() => $(`.gbtn[data-g="${CSS.escape(id)}"]`)?.focus());
}
function reorderGroups(ids){
  const before = GROUPS.map(g => g.id);
  GROUPS.sort((a,b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  saveState(); renderAllGroups();
  if(connected()) api('groupOrder', {ids}).catch(e => toast('그룹 순서를 시트에 못 남겼어요 — ' + e.message, true));
  if(before.join() !== ids.join()) UNDO.push({label:'그룹 순서', fn: async () => reorderGroups(before)});
}
function renderAllGroups(){
  if(S.settings.mode === 'sidebar') renderChrome();
  if(S.tab === 'shoot') renderShoot();
}

/* ═══════ 슛하기 화면 ═══════ */
function tileHTML(room, opts){
  const n = room.refs.length;

  return `
    <span class="tile" style="${cvar(room.color)}">${gicon(room.glyph)}<span class="badge ${n?'':'zero'}" aria-hidden="true">${n}</span></span>
    <span class="name">${esc(room.name)}</span>${o.gtag ? `<span class="gtag">${esc(gname(room.g))}</span>` : ''}`;
}
function slotHTML(room, opts){
  return `<div class="slot" data-room="${room.id}" data-id="${room.id}" role="button" tabindex="0"
      aria-label="${esc(room.name)}, 레퍼런스 ${room.refs.length}개 — 누르면 열기, 두 번 누르면 복사한 링크 담기">
      <button class="star" data-star="${room.id}" aria-pressed="${!!room.fav}" aria-label="${esc(room.name)} 즐겨찾기" title="즐겨찾기">★</button>

const HINT = () => `<p class="hint2"><span><b>클릭</b> 방 열기</span><span><b>더블클릭</b> 복사한 링크 담기(여러 개면 몽땅)</span>
  <span>링크를 아이콘에 <b>끌어다 놓기</b></span><span>아무 데서나 <kbd>${MOD}V</kbd> — 1개면 바로 슛, 여러 개면 임시저장</span>
  <span>아이콘을 끌어 <b>★ 즐겨찾기</b>나 다른 그룹에 놓기</span></p>`;

function renderShoot(){
  const el = $('#view-shoot');
  const mode = S.settings.mode || 'sidebar';
  const g = currentGroup();
  if(mode === 'kanban'){ el.innerHTML = kanbanHTML(); bindKanban(el); return; }
  const tabs = mode === 'sidebar' ? '' : `<div style="margin-bottom:18px">${groupListHTML('h')}</div>`;
  const head = headHTML(g);
  let body;
  if(g === 'inbox') body = inboxHTML();
  else{
    const rooms = g === 'fav' ? favRooms() : roomsIn(g);
    if(g === 'fav' && !rooms.length) body = `<div class="favempty">★ 즐겨찾기가 비었어요. 방 아이콘 왼쪽 위 <b>★</b>를 누르거나, 아이콘을 <b>★ 즐겨찾기</b> 탭으로 끌어다 놓으면 여기에 모여요. 앱을 열면 이 탭이 먼저 보여요.</div>`;
    else if(mode === 'list') body = listHTML(rooms, g);
    else if(mode === 'court') body = courtHTML(rooms, g);
    else body = `<div class="iconrow" id="gpanel" role="tabpanel">${rooms.map(r => slotHTML(r, {gtag: g==='fav'})).join('')}
        ${g !== 'fav' ? `<button class="slot new-room" data-group="${esc(g)}" aria-label="${esc(gname(g))}에 새 방 만들기"><span class="tile new">${ICONS.plus}</span><span class="name">새 방</span></button>` : ''}
      </div>`;
  }
  el.innerHTML = mode === 'sidebar'
    ? `${head}${body}${g !== 'inbox' ? HINT() : ''}`
    : `<section class="group">${tabs}${head}${body}${g !== 'inbox' ? HINT() : ''}</section>`;

}
function headHTML(g){
  const c = groupCount(g);
  const editable = g !== 'fav' && g !== 'inbox';
  const gid = (groupOf(g)||{}).gid;
  return `<div class="shead">
    <h2>${g==='fav'?'<span style="color:var(--gold)">★</span>':''}<span class="gname" ${editable?`data-rename="${esc(g)}" title="눌러서 이름 바꾸기"`:''}>${esc(gname(g))}</span></h2>
    <span class="meta2">${g==='inbox' ? `${INBOX.length}개 대기 중` : `방 ${c.rooms} · 레퍼 ${c.refs}`}</span>
