function bindShootBody(el, g){
  $('[data-rename]', el)?.addEventListener('click', e => startRenameGroup(e.currentTarget, g));
  if(g === 'inbox'){ bindInbox(el); return; }
  $$('.slot[data-room]', el).forEach(slot => bindSlot(slot, g));
  $$('.new-room', el).forEach(b => b.addEventListener('click', () => openEdit(null, b.dataset.group)));
  $$('.rrow[data-room]', el).forEach(row => bindSlot(row, g));
  $('#court-clip', el)?.addEventListener('click', checkClipForCourt);
}

let clickT;
function bindSlot(slot, g){
  const id = slot.dataset.room;
  const room = roomOf(id);
  slot.addEventListener('click', e => {
    if(e.target.closest('.star')) return;
    clearTimeout(clickT);
    clickT = setTimeout(() => openRoom(id), 240);
  });
  slot.addEventListener('dblclick', e => {
    if(e.target.closest('.star')) return;
    clearTimeout(clickT);
    pasteIntoRoom(id);
  });
  slot.addEventListener('keydown', e => {
    if(e.target !== slot) return;
    if(e.key === 'Enter' && e.shiftKey){ e.preventDefault(); pasteIntoRoom(id); }
    else if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openRoom(id); }
    else if(e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && g !== 'fav'){ e.preventDefault(); moveRoom(id, e.key === 'ArrowLeft' ? -1 : 1); }
    else if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); deleteRoomById(id); }
  });
  slot.querySelector('.star')?.addEventListener('click', e => { e.stopPropagation(); setFav(id, !room.fav); });
  /* 바깥에서 링크를 끌어다 놓기 (HTML 끌어놓기) */
  slot.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect='copy'; slot.classList.add('dropping'); });
  slot.addEventListener('dragleave', () => slot.classList.remove('dropping'));
  slot.addEventListener('drop', e => {
    e.preventDefault(); slot.classList.remove('dropping');
    const text = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '';
    handleLinksForRoom(id, extractLinks(text), {left:e.clientX-8, top:e.clientY-8, width:16, height:16});
  });
  /* 포인터로 끌기 — 순서 · ★ · 다른 그룹 */
  draggable(slot, {
    sortSel: g === 'fav' ? null : '.slot[data-room], .rrow[data-room]',
    accept: t => {
      const d = t.dataset.drop;
      return d === 'fav' ? !room.fav : d.startsWith('group:') && d.slice(6) !== room.g;
    },
    onDrop(t){
      const d = t.dataset.drop;
      if(d === 'fav') setFav(id, true);
      else if(d.startsWith('group:')) moveRoomToGroup(id, d.slice(6));
    },
    onReorder(ids){ reorderRooms(g, ids); }
  });
}

/* ── 방 조작: 즐겨찾기 · 순서 · 그룹 옮기기 ── */
function roomPatch(room, patch){
  if(!connected()) return Promise.resolve();
  return api('roomUpsert', Object.assign({g:room.g, name:room.name}, patch))
    .catch(e => toast('시트에 못 남겼어요 — ' + e.message, true));
}
function setFav(id, on, noUndo){
  const room = roomOf(id); if(!room) return;
  room.fav = !!on; saveState(); renderAllGroups();
  roomPatch(room, {fav:room.fav});
  if(!noUndo) pushUndo(`「${room.name}」 즐겨찾기 ${on?'추가':'해제'}`, async () => setFav(id, !on, true),
    on ? `★ 「${room.name}」을 즐겨찾기에 넣었어요` : `「${room.name}」 즐겨찾기를 뺐어요`);
}
function reorderRooms(g, ids){
  const rooms = roomsIn(g);
  const before = rooms.map(r => r.id);
  ids.forEach((id, i) => { const r = roomOf(id); if(r && r.g === g) r.order = i; });
  saveState();
  if(connected()) api('roomOrder', {g, names: ids.map(id => (roomOf(id)||{}).name).filter(Boolean)})
    .catch(e => toast('방 순서를 시트에 못 남겼어요 — ' + e.message, true));
  UNDO.push({label:'방 순서', fn: async () => { reorderRooms(g, before); renderShoot(); }});
}
function moveRoom(id, dir){
  const room = roomOf(id); if(!room) return;
  const ids = roomsIn(room.g).map(r => r.id);
  const i = ids.indexOf(id), j = i + dir;
  if(j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  reorderRooms(room.g, ids); renderShoot();
  requestAnimationFrame(() => $(`[data-room="${id}"]`)?.focus());
}
async function moveRoomToGroup(id, to, noUndo){
  const room = roomOf(id); if(!room) return;
  const from = room.g;
  if(ROOMS.some(r => r.g === to && r.name === room.name)){ toast(`「${gname(to)}」에 같은 이름의 방이 있어요`, true); return; }
  room.g = to; room.order = null; saveState(); renderAllGroups();
  if(connected()){
    try{ await api('roomMove', {name:room.name, from, to, glyph:room.glyph, color:room.color}); }
    catch(e){ room.g = from; saveState(); renderAllGroups(); toast('방을 못 옮겼어요 — ' + e.message, true); return; }
  }
  if(!noUndo) pushUndo(`「${room.name}」 그룹 옮기기`, () => moveRoomToGroup(id, from, true),
    `「${room.name}」을 「${gname(to)}」으로 옮겼어요 — 시트 줄도 같이`);
}

/* ═══════ 담기: 더블클릭 · 붙여넣기 · 끌어놓기 ═══════ */
async function pasteIntoRoom(id){
  const room = roomOf(id); if(!room) return;
  let text = '';
  try{ text = await navigator.clipboard.readText(); }
  catch(e){
    askLinks({room, reason:'클립보드를 읽을 권한이 없어요. 주소창 왼쪽 자물쇠 › 클립보드 › 허용을 누르면 다음부터는 더블클릭만으로 돼요. 지금은 여기 붙여넣어 주세요.'});
    return;
  }
  const links = extractLinks(text);
  if(!links.length){ askLinks({room, reason:'클립보드에 링크가 없어요. 링크를 복사한 뒤 다시 더블클릭하거나, 여기 붙여넣어 주세요.'}); return; }
  handleLinksForRoom(id, links, rectOf(id));
}
function rectOf(id){
  const t = $(`[data-room="${id}"] .tile`);
  if(!t) return null;
  const r = t.getBoundingClientRect();
  return {left:r.left+r.width/2-8, top:r.top-40, width:16, height:16};
}
function handleLinksForRoom(id, links, rect){
  if(!links.length){ toast('링크가 아니에요 — http로 시작하는 주소를 넣어 주세요', true); return; }
  if(links.length === 1) openShootSheet({url:links[0].url, note:links[0].note, roomId:id, src:'pc', rect});
  else bulkSave(roomOf(id), links);
}
window.addEventListener('paste', e => {
  if(e.target.closest && e.target.closest('input,textarea,[contenteditable="true"]')) return;
  if($$('.scrim.on').length) return;
  const text = (e.clipboardData && e.clipboardData.getData('text')) || '';
  const links = extractLinks(text);
  if(!links.length) return;
  e.preventDefault();
  if(links.length === 1) openShootSheet({url:links[0].url, note:links[0].note, roomId:null, src:'pc'});
  else addToInbox(links);
});

/* 여러 개 → 임시저장 */
async function addToInbox(links){
  const merged = links.merged || 0;
  const have = new Set(INBOX.map(x => x.url));
  const fresh = links.filter(l => !have.has(l.url));
  const skipped = links.length - fresh.length;
  if(!fresh.length){ toast(`이미 임시저장에 있는 링크예요 (${links.length}개)`); return; }
  const local = fresh.map(l => ({id:nid('i'), url:l.url, t:titleFromUrl(l.url), host:hostOf(l.url), kind:kindOf(l.url), at:'방금', src:'pc', note:l.note||'', pending:true}));
  INBOX.unshift(...local);
  saveState(); renderAllGroups();
  const msg = `${fresh.length}개를 임시저장에 담았어요` + (merged ? ` · vidIQ 중복 ${merged}개 합침` : '') + (skipped ? ` · 이미 있던 ${skipped}개 뺌` : '');
  let rows = [];
  if(connected()){
    try{
      const j = await api('inboxAddMany', {items: fresh.map(l => ({url:l.url, note:l.note, kind:kindOf(l.url)}))});
      mergeInbox(j.items || []);
      rows = INBOX.filter(x => fresh.some(l => l.url === x.url)).map(x => x.row).filter(Boolean);
      saveState(); renderAllGroups();
    }catch(e){
      toast('임시저장을 시트에 못 올렸어요 — 이 브라우저에만 있어요: ' + e.message, true);
      return;
    }
  }
  pushUndo(`임시저장 ${fresh.length}개 담기`, async () => {
    if(rows.length) await api('inboxSet', {rows, status:'삭제'});
    INBOX = INBOX.filter(x => !fresh.some(l => l.url === x.url));
    saveState(); renderAllGroups();
  }, msg);
}
function mergeInbox(items){
  const local = INBOX.filter(x => !x.row && x.pending);
  INBOX = items.map(it => ({
    id:'i' + it.row, url:it.url, t:it.title || titleFromUrl(it.url), host:hostOf(it.url),
    kind:it.kind || kindOf(it.url), at:String(it.at||'').slice(5,16), src: it.note && /vidIQ/.test(it.note) ? 'pc' : 'mobile', row:it.row, note:it.note || ''
  }));
  local.forEach(x => { if(!INBOX.some(y => y.url === x.url)) INBOX.push(x); });
}

/* 여러 개 → 그 방에 몽땅 (이유는 나중에) */
async function bulkSave(room, items, opt){
  if(!room || !items.length) return;
  const o = opt || {};
  const slot = $(`[data-room="${room.id}"]`);
  slot?.classList.add('busy');
  const made = [];
  let fail = 0;
  for(let i = 0; i < items.length; i++){
    const it = items[i];
    toast(`「${room.name}」에 담는 중 ${i+1}/${items.length} — 정보 가져오는 중이라 하나에 2~3초 걸려요`, false, null, -1);
    if(S.settings.dupWarn && room.refs.some(r => r.u === it.url)) continue;
    const ref = {id:nid('r'), t:it.t || titleFromUrl(it.url), ch:hostOf(it.url), subs:null, note:it.note || '메모 없음', kind:kindOf(it.url),
      d:new Date().toISOString().slice(0,10), u:it.url, color:colorFor(it.url), ai:'', src:'pc', unsynced:true};
    room.refs.unshift(ref);
    refreshCounts();
    if(connected()){
      try{
        const j = await api('save', {row:{group:room.g, room:room.name, url:it.url, why:it.note || '', src:'pc', lite:true,
          glyph:room.glyph, color:room.color, inboxRow: it.row || null}}, {retry:0});
        Object.assign(ref, {id:j.id, sid:j.id, unsynced:false, t:j.title || ref.t, ch:j.channel || ref.ch, kind:j.kind || ref.kind,
          thumb:j.thumbnail || '', avatar:j.avatar || '', subs:j.subs === '' ? null : j.subs, views:j.views === '' ? null : j.views,
          published:j.published || '', country:j.country || '', countryWhy:j.countryWhy || ''});
        if(j.metaError) ref.warn = '정보 일부를 못 가져왔어요: ' + j.metaError;
        if(it.inboxId) INBOX = INBOX.filter(x => x.id !== it.inboxId);
        made.push(ref);
      }catch(e){ ref.unsynced = String(e.message || e); fail++; }
    }else made.push(ref);
    saveState();
  }
  slot?.classList.remove('busy');
  renderAllGroups();
  if(S.openRoom === room.id) renderRoomBody();
  const sids = made.map(r => r.sid).filter(Boolean);
  const msg = `「${room.name}」에 ${made.length}개 담았어요` + (fail ? ` · 실패 ${fail}개(카드에 표시)` : '') + ' · 이유는 방에서 몰아쓰기';
  UNDO.push({label:`「${room.name}」에 ${made.length}개 담기`, fn: async () => {
    if(sids.length) await api('trashRows', {ids:sids});
    room.refs = room.refs.filter(r => !made.includes(r));
    saveState(); renderAllGroups();
  }});
  toast(msg, fail > 0, {label:'이유 몰아쓰기', fn: () => openRoom(room.id, {view:'sheet', noReason:true})});
}
function refreshCounts(){
  if(S.tab === 'shoot'){
    $$('[data-room]').forEach(s => {
      const r = roomOf(s.dataset.room); const b = s.querySelector('.badge');
      if(r && b){ b.textContent = r.refs.length; b.classList.toggle('zero', !r.refs.length); }
      const c = s.querySelector('.c'); if(r && c) c.textContent = r.refs.length;
    });
  }
}

function bindInbox(el){
  $$('.pk', el).forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.pk; S.ibxSel.has(id) ? S.ibxSel.delete(id) : S.ibxSel.add(id); renderShoot();
  }));
  $('#ibx-all', el)?.addEventListener('click', () => {

    renderShoot();
  });
  $('#ibx-send', el)?.addEventListener('click', () => {
    const items = INBOX.filter(x => S.ibxSel.has(x.id));
    askRoom({title:'어느 방에 몽땅 넣을까요?', desc:`${items.length}개 — 이유는 나중에 방에서 몰아쓰기`, onPick(room){
      S.ibxSel.clear();
      bulkSave(room, items.map(x => ({url:x.url, note:x.note, row:x.row, inboxId:x.id, t:x.t})));
    }});
  });
  $('#ibx-drop', el)?.addEventListener('click', () => dropInbox(INBOX.filter(x => S.ibxSel.has(x.id))));
  $$('.ibx .file', el).forEach(b => b.addEventListener('click', () => fileInbox(b.dataset.id)));
  $$('.ibx .drop', el).forEach(b => b.addEventListener('click', () => dropInbox(INBOX.filter(x => x.id === b.dataset.id))));
}
async function dropInbox(items){
  if(!items.length) return;
  const rows = items.map(x => x.row).filter(Boolean);
  INBOX = INBOX.filter(x => !items.includes(x));
  items.forEach(x => S.ibxSel.delete(x.id));
  saveState(); renderAllGroups();
  if(rows.length && connected()){
    try{ await api('inboxSet', {rows, status:'삭제'}); }
    catch(e){ toast('시트의 임시저장은 그대로예요 — ' + e.message, true); }
  }
  pushUndo(`임시저장 ${items.length}개 지우기`, async () => {
    if(rows.length) await api('inboxSet', {rows, status:'대기'});
    INBOX.unshift(...items); saveState(); renderAllGroups();
  }, `임시저장에서 ${items.length}개를 지웠어요`);
}
function fileInbox(id){
  const it = INBOX.find(x => x.id === id);

  openShootSheet({url:it.url, title:it.t, kind:it.kind, note:it.note, roomId:null, src:it.src, inboxId:it.id, inboxRow:it.row, rect:null});
}

/* ═══════════ shoooot v3 — 2부: 슛 시트 · 방 · 보관함 · 찾기 · 급상승 · 설정 · 동기화 ═══════════ */

/* ═══════ 슛 시트 (링크 1개) ═══════ */
function openShootSheet(d){
  const r0 = d.roomId ? roomOf(d.roomId) : null;
  const cg = currentGroup();
  const g = r0 ? r0.g : (groupOf(cg) ? cg : (GROUPS[0]||{}).id);
  S.draft = {
    url:d.url, title:d.title || titleFromUrl(d.url), host:hostOf(d.url), kind:d.kind || kindOf(d.url),
    roomId:d.roomId || null, group:g, note:d.note || '', ai:'', aiState:'idle', aiErr:'', src:d.src || 'pc',
    inboxId:d.inboxId || null, inboxRow:d.inboxRow || null, rect:d.rect || null
  };
  renderShootSheet();
  openScrim('#shoot-scrim');
  setTimeout(()=>$('#sh-note')?.focus(), 60);
  loadMeta(S.draft);
}
async function loadMeta(d){
  if(!connected() || d.metaState) return;
  d.metaState = 'loading'; renderShootSheet();
  try{
    const j = await api('meta', {url:d.url});
    if(S.draft !== d) return;
    d.meta = j;
    if(!d.titleEdited && j.title) d.title = j.title;
    if(j.kind) d.kind = j.kind;
    if(j.channelName) d.channel = j.channelName;
    if(j.thumbnail) d.thumb = j.thumbnail;
    if(j.avatar) d.avatar = j.avatar;
    if(j.subs != null) d.subs = j.subs;
    d.metaState = 'done';
  }catch(e){
    if(S.draft !== d) return;
    d.metaState = 'error'; d.metaErr = String(e.message || e);
  }
  if(S.draft === d) renderShootSheet();
}
function closeShootSheet(){ closeScrim('#shoot-scrim'); S.draft = null; }

function metaFields(item){
  const m = item.meta || {};

    .forEach(k => put(k, m[k]));

}
async function syncSave(item, room, inboxRow){

      group:room.g, room:room.name, title:item.t, kind:item.kind, channel:item.ch, subs:item.subs, why:item.note, ai:item.ai,
      url:item.u, src:item.src, glyph:room.glyph, color:room.color, inboxRow:inboxRow || null
    }, metaFields(item))});
    item.sid = j.id; item.id = j.id; item.unsynced = false;

function fly(fromRect, roomId){
  const slot = $(`[data-room="${roomId}"]`);
  const after = () => { if(slot){ slot.classList.add('pop'); setTimeout(()=>slot.classList.remove('pop'), 460); } };
  if(!slot || reduce || !fromRect){ after(); return; }
  const to = (slot.querySelector('.tile') || slot).getBoundingClientRect();
  const dot = document.createElement('div');
  dot.className = 'flyer';
  dot.style.left = (fromRect.left - 0) + 'px'; dot.style.top = fromRect.top + 'px';
  document.body.appendChild(dot);
  const dx = to.left + to.width/2 - fromRect.left - 8, dy = to.top + to.height/2 - fromRect.top - 8;
  dot.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.55}px,${dy*.55-26}px) scale(1.25)`, offset:.55},{transform:`translate(${dx}px,${dy}px) scale(.18)`, opacity:.2}],
    {duration:420, easing:'cubic-bezier(.4,0,.2,1)'}).onfinish = () => { dot.remove(); after(); };
}

const SORTS = [
  {k:'saved', label:'담은 순'}, {k:'views', label:'조회수순'}, {k:'subs', label:'구독자순'},
  {k:'newest', label:'최신 콘텐츠순'}, {k:'oldest', label:'오래된 순'}, {k:'likes', label:'좋아요순'}
];
function sortRefs(list, key){
  if(key === 'saved' || !key) return list;
  const num = v => (v == null || v === '') ? null : Number(v);
  const time = v => { const t = new Date(String(v||'').replace(' ','T')); return isNaN(t) ? null : t.getTime(); };
  const pick = r => key === 'views' ? num(r.views) : key === 'likes' ? num(r.likes) : key === 'subs' ? num(r.subs) : time(r.published);
  const desc = key !== 'oldest';
  return [...list].sort((a,b) => {
    const x = pick(a), y = pick(b);
    if(x == null && y == null) return 0; if(x == null) return 1; if(y == null) return -1;
    return desc ? y - x : x - y;
  });
}

/* 한 칸 고치기 → 시트 반영 · 되돌리기 */
const FKEY = {title:'t', channel:'ch', why:'note', country:'country'};
const FLABEL = {title:'제목', channel:'채널', why:'저장 이유', country:'국가'};
async function updateField(ref, field, value, noUndo){
  const k = FKEY[field];
  const old = ref[k];
  let v = value;
  if(field === 'why' && !v) v = '메모 없음';
  if(field === 'country') v = String(v||'').trim().toUpperCase();
  if(String(old ?? '') === String(v)){ renderRoomOrLib(); return; }
  ref[k] = v;
  const oldWhy = ref.countryWhy;
  if(field === 'country') ref.countryWhy = v ? '직접' : '';
  saveState(); renderRoomOrLib(); setSaveState('saving');
  if(connected() && ref.sid){
    try{ await api('updateRow', {id:ref.sid, field, value:v}); setSaveState('ok'); }
    catch(e){
      ref[k] = old; if(field === 'country') ref.countryWhy = oldWhy;
      saveState(); renderRoomOrLib(); setSaveState('bad');
      toast(`${FLABEL[field]}을(를) 시트에 못 남겨서 원래대로 돌렸어요 — ${e.message}`, true);
      return;
    }
  }else setSaveState(connected() ? 'bad' : 'ok');
  if(!noUndo) pushUndo(`${FLABEL[field]} 고치기`, () => updateField(ref, field, field === 'why' && old === '메모 없음' ? '' : old, true),
    `${FLABEL[field]}을(를) 고쳤어요 — 시트에도 반영`);
}
let saveStateT;
function setSaveState(st){
  const el = $('#sheet-save'); if(!el) return;
  clearTimeout(saveStateT);
  el.className = 'savestate ' + (st === 'ok' ? 'ok' : st === 'bad' ? 'bad' : '');
  el.textContent = st === 'saving' ? '저장 중…' : st === 'ok' ? '✓ 시트에 저장됨' : st === 'bad' ? '⚠ 시트에 못 남김' : '';
  if(st === 'ok') saveStateT = setTimeout(() => { el.textContent = ''; }, 4000);
}

function editCell(td){
  if(td.classList.contains('editing')) return;
  const hit = refById(td.closest('tr').dataset.id); if(!hit) return;
  const f = td.dataset.f;
  if(connected() && !hit.r.sid){ toast('아직 시트에 없는 줄이에요 — 보관함 새로고침 뒤에 고칠 수 있어요', true); return; }
  const cur = f === 'why' ? (noReason(hit.r) ? '' : hit.r.note) : (hit.r[FKEY[f]] || '');
  td.classList.add('editing');
  td.innerHTML = `<input value="${esc(cur)}" aria-label="${FLABEL[f]} 고치기" ${f==='country'?'maxlength="2" placeholder="KR"':''}>`;
  const inp = $('input', td); inp.focus(); inp.select();
  let done = false;
  const finish = async (save, next) => {
    if(done) return; done = true;
    const v = inp.value.trim();
    if(save) await updateField(hit.r, f, v);
    else renderRoomOrLib();
    if(next){
      const all = $$('#room-body td.ed');
      const row = $(`#room-body tr[data-id="${CSS.escape(hit.r.id)}"]`);
      const cells = all;
      const i = cells.findIndex(c => c.closest('tr') === row && c.dataset.f === f);
      const n = cells[i + (next > 0 ? 1 : -1)];
      if(n) editCell(n);
    }
  };
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if(e.key === 'Escape'){ e.preventDefault(); finish(false); }
    else if(e.key === 'Tab'){ e.preventDefault(); finish(true, e.shiftKey ? -1 : 1); }
  });
  inp.addEventListener('blur', () => finish(true));
}

/* 카드 보조: 통계 · 채널 정보 · 태그 색 · 인기 쇼츠 */
function statsHTML(r){
  const has = [r.vph, r.views, r.likes, r.comments].some(v => v != null && v !== '');

  const cell = (label, value, cls) => value === '' || value == null ? '' : `<span class="st ${cls||''}"><i>${label}</i><b>${value}</b></span>`;
  const foot = [fmtAgo(r.published), fmtDur(r.duration)].filter(Boolean).join(' · ');

    ${cell('조회수', r.views != null && r.views !== '' ? fmtShort(r.views) : '')}
    ${cell('좋아요', r.likes != null && r.likes !== '' ? fmtShort(r.likes) : '')}

function tagStyle(t){
  const room = ROOMS.find(r => r.name.replace(/\s/g,'') === String(t).replace(/\s/g,''));

/* 방 지우기 = 휴지통 (빈 방도 되돌리기 가능) */
async function deleteRoomById(id){
  const room = roomOf(id); if(!room) return;
  const run = async () => {
    let batch = null;
    if(connected()){
      try{ batch = (await api('roomDelete', {g:room.g, name:room.name, glyph:room.glyph, color:room.color})).batch; }
      catch(e){ toast('방을 못 지웠어요 — ' + e.message, true); return; }
    }
    const idx = ROOMS.indexOf(room);
    ROOMS.splice(idx, 1);
    if(S.openRoom === id) closeRoom();
    S.sel.clear(); syncSel(); saveState(); renderAllGroups();
    if(S.tab === 'library') renderLibrary();
    S.trashN++;
    pushUndo(`방 「${room.name}」 지우기`, async () => {
      if(batch) await api('restore', {batch});
      ROOMS.splice(Math.min(idx, ROOMS.length), 0, room);
      S.trashN = Math.max(0, S.trashN - 1);
      saveState(); renderAllGroups(); if(S.tab === 'library') renderLibrary();
    }, `「${room.name}」 방을 휴지통으로 옮겼어요 (레퍼 ${room.refs.length}개)`);
  };
  if(!room.refs.length) return run();
  askConfirm({title:`「${room.name}」 방을 지울까요?`,
    desc:`안에 있는 ${room.refs.length}개도 함께 휴지통으로 가요. 알림의 [되돌리기]나 ${MOD}Z로 그대로 돌아와요.`,
    ok:'휴지통으로', danger:true, onOk:run});
}

function syncSel(){ $('#sel-n').textContent = S.sel.size; $('#selbar').classList.toggle('on', S.sel.size > 0); }
$('#sel-clear').addEventListener('click', () => { S.sel.clear(); syncSel(); renderRoomOrLib(); });
$('#sel-del').addEventListener('click', () => trashRefs([...S.sel]));
$('#sel-move').addEventListener('click', () => {
  const n = S.sel.size;
  askRoom({title:'어느 방으로 옮길까요?', desc:`${n}개를 옮겨요`, exclude: S.openRoom, onPick(t){ moveRefsTo([...S.sel], t.id); }});
});
async function trashRefs(ids){
  const picked = [];
  ROOMS.forEach(room => room.refs.forEach(r => { if(ids.includes(r.id)) picked.push({r, room, idx:room.refs.indexOf(r)}); }));
  if(!picked.length) return;
  const sids = picked.map(p => p.r.sid).filter(Boolean);
  let batch = null;
  if(sids.length && connected()){
    try{ batch = (await api('trashRows', {ids:sids})).batch; }
    catch(e){ toast('휴지통으로 못 옮겼어요 — ' + e.message, true); return; }
  }
  picked.forEach(p => { p.room.refs = p.room.refs.filter(x => x !== p.r); });
  S.sel.clear(); syncSel(); saveState(); renderAllGroups(); renderRoomOrLib();
  S.trashN++;
  pushUndo(`${picked.length}개 지우기`, async () => {
    if(batch) await api('restore', {batch});
    picked.forEach(p => p.room.refs.splice(Math.min(p.idx, p.room.refs.length), 0, p.r));
    S.trashN = Math.max(0, S.trashN - 1);
    saveState(); renderAllGroups(); renderRoomOrLib();
  }, `${picked.length}개를 휴지통으로 옮겼어요`);
}
async function moveRefsTo(ids, targetId, noUndo){
  const target = roomOf(targetId);
  if(!target || !ids.length) return;
  const moving = [];
  ROOMS.forEach(r => { r.refs = r.refs.filter(x => { if(ids.includes(x.id) && r !== target){ moving.push({x, from:r}); return false; } return true; }); });
  if(!moving.length){ toast(`이미 「${target.name}」에 있어요`, true); return; }
  target.refs.unshift(...moving.map(m => m.x));
  S.sel.clear(); syncSel(); saveState(); renderAllGroups(); renderRoomOrLib();
  const sids = moving.map(m => m.x.sid).filter(Boolean);
  if(sids.length && connected()){
    try{ await api('moveRows', {ids:sids, group:target.g, room:target.name, glyph:target.glyph, color:target.color}); }
    catch(e){ toast('시트에서 못 옮겼어요 — 새로고침하면 시트 기준으로 돌아가요: ' + e.message, true); }
  }
  if(noUndo) return;
  pushUndo(`${moving.length}개 옮기기`, async () => {
    const groups = new Map();
    moving.forEach(m => { if(!groups.has(m.from)) groups.set(m.from, []); groups.get(m.from).push(m.x.id); });
    for(const [from, list] of groups) await moveRefsTo(list, from.id, true);
  }, `${moving.length}개를 「${target.name}」으로 옮겼어요`);
}

    catch(err){ toast('국가를 못 채웠어요 — ' + err.message, true); renderLibrary(); }
  });
  renderLibBody();
}
function libFiltered(){
  const q = S.libQ.toLowerCase();
  return allRefs().filter(r => !q || [r.t, r.ch, r.note, r.room.name].join(' ').toLowerCase().includes(q));
}
function renderLibBody(){
  const el = $('#lib-body');
  if(S.libLoading && !allRefs().length){ el.innerHTML = `<p class="slow">시트에서 불러오는 중…</p>`; return; }
  if(S.libError && !allRefs().length){
    el.innerHTML = `<div class="errbox" role="alert"><div class="ico">${ICONS.warn}</div><div><h3>보관함을 불러오지 못했어요</h3>
      <p>${navigator.onLine ? '서버가 응답하지 않았어요.' : '인터넷 연결이 끊겨 있어요.'} 시트의 레퍼런스는 그대로 있어요.</p>
      <button class="btn" id="lib-retry">다시 시도</button></div></div>`;
    $('#lib-retry').addEventListener('click', () => syncNow());
    return;
  }
  const list = libFiltered();
  if(!list.length){ el.innerHTML = `<div class="empty"><div class="ico">${ICONS.inbox}</div><h3>${S.libQ ? '찾는 게 없어요' : '보관함이 비어 있어요'}</h3><p>슛하기에서 방 아이콘을 더블클릭해 링크를 담아 보세요.</p></div>`; return; }
  /* 국가 → 종류 → 방 */
  const tree = new Map();
  list.forEach(r => {
    const c = r.country || '';
    if(!tree.has(c)) tree.set(c, {n:0, why:new Set(), kinds:new Map()});
    const C = tree.get(c); C.n++; if(r.countryWhy) C.why.add(r.countryWhy);
    const k = isContent(r) ? '컨텐츠' : '채널';
    if(!C.kinds.has(k)) C.kinds.set(k, new Map());
    const K = C.kinds.get(k);
    if(!K.has(r.room.id)) K.set(r.room.id, []);
    K.get(r.room.id).push(r);
  });
  const countries = [...tree.entries()].sort((a,b) => (a[0]==='' ) - (b[0]==='') || b[1].n - a[1].n);
  const whyTxt = s => s.has('확정') && s.size === 1 ? '' : s.has('추정') ? ' (일부 추정)' : '';
  if(S.libView === 'fold'){
    el.innerHTML = `<div class="tree">${countries.map(([c, C]) => {
      const key = 'c:' + c, open = S.libFold[key] !== false;
      return `<button class="tnode" data-fold="${esc(key)}" aria-expanded="${open}">${ICONS.chev}<span class="ccode">${esc(c||'??')}</span>${esc(ccName(c))}<span class="n">${C.n}</span><span style="font-weight:500;font-size:11.5px;color:var(--muted)">${whyTxt(C.why)}</span></button>
        ${open ? [...C.kinds.entries()].sort((a,b) => a[0]==='채널' ? -1 : 1).map(([k, K]) => {
          const key2 = key + '|' + k, open2 = S.libFold[key2] !== false;
          const n2 = [...K.values()].reduce((a,x) => a + x.length, 0);
          return `<button class="tnode k2" data-fold="${esc(key2)}" aria-expanded="${open2}">${ICONS.chev}${k}<span class="n">${n2}</span></button>
            ${open2 ? `<div class="tkids">${[...K.entries()].map(([rid, refs]) => { const room = roomOf(rid); return `
              <div class="rline"><span class="dot" style="background:${COLORS[room.color][1]}"></span><b>${esc(room.name)}</b><span class="g">${esc(gname(room.g))}</span><span class="c">${refs.length}</span>
                <span class="sp"></span><button class="mini" data-open="${rid}" data-kind="${k==='채널'?'channel':'content'}">열기</button>
                <button class="mini del" data-delroom="${rid}" aria-label="${esc(room.name)} 방 지우기" title="방 지우기 (되돌리기 가능)">${ICONS.trash}</button></div>`; }).join('')}</div>` : ''}`;
        }).join('') : ''}`;
    }).join('')}</div>`;
    $$('[data-fold]', el).forEach(b => b.addEventListener('click', () => { const k = b.dataset.fold; S.libFold[k] = S.libFold[k] === false; saveState(); renderLibBody(); }));
    $$('[data-open]', el).forEach(b => b.addEventListener('click', () => openRoom(b.dataset.open, {kind:b.dataset.kind})));
    $$('[data-delroom]', el).forEach(b => b.addEventListener('click', () => deleteRoomById(b.dataset.delroom)));
    return;
  }
  /* 펼쳐 보기: 국가를 맨 위 탭으로 — 왼쪽부터 많은 순, 하나씩 골라 보기 */
  if(!countries.some(([c]) => c === S.libCountry)) S.libCountry = countries[0][0];
  const cur = countries.find(([c]) => c === S.libCountry);
  const C = cur[1];
  el.innerHTML = `
    <div class="glist h ctabs" role="tablist" aria-label="국가">${countries.map(([c, X]) => `
      <div class="gitem"><button class="gbtn" role="tab" data-cc="${esc(c)}" aria-selected="${c === S.libCountry}">
        <span class="ccode">${esc(c||'??')}</span>${esc(ccName(c))}<span class="n">${X.n}</span></button></div>`).join('')}</div>
    ${[...C.kinds.entries()].sort((a,b) => a[0]==='채널' ? -1 : 1).map(([k, K]) => `
      <p class="subhead">${k} · ${[...K.values()].reduce((a,x)=>a+x.length,0)}</p>
      <div class="cards">${[...K.values()].flat().map(r => cardHTML(r, r.room, true)).join('')}</div>`).join('')}`;
  $$('[data-cc]', el).forEach(b => b.addEventListener('click', () => { S.libCountry = b.dataset.cc; saveState(); renderLibBody(); }));
  bindPicks(el); bindCardExtras(el); bindOpinions(el);
}

/* 휴지통 */
async function openTrash(){
  if(!connected()){ toast('휴지통은 시트에 있어요 — 먼저 연결해 주세요', true); return; }
  askShell('휴지통', '지운 것은 여기 모여요. 되돌리면 원래 탭·방으로 돌아가요.', `<div id="trash-body"><p class="help">불러오는 중…</p></div>`);
  try{
    const j = await api('trashList');
    S.trashN = j.batches.length;
    $('#trash-body').innerHTML = !j.batches.length ? '<p class="help">비어 있어요.</p>' : `<div class="picklist">${j.batches.map(b => `
      <div class="pickrow" style="cursor:default"><span style="min-width:0;flex:1"><span class="pn" style="display:block">${esc(b.label || b.tab)}</span>
        <span class="pg" style="display:block">${esc(b.at)} · ${b.kinds.group ? '그룹' : b.kinds.room ? '방' : '레퍼'}${b.n ? ` · 레퍼 ${b.n}개` : ''}</span></span>
        <button class="ghost-btn" data-restore="${esc(b.batch)}">되돌리기</button></div>`).join('')}</div>
      <p class="help" style="margin-top:10px">완전히 비우려면 구글시트의 「_휴지통」 탭에서 줄을 지우면 돼요.</p>`;
    $$('[data-restore]').forEach(b => b.addEventListener('click', async () => {

}

/* ═══════ 레퍼찾기 (검색 + 필터) ═══════ */
const SUBS_OPTS = [['all','전체'],['1e4','1만 이하'],['1e5','10만 이하'],['1e6','100만 이하'],['big','100만 넘게']];
function renderFacets(){
  const all = allRefs();
  const count = f => all.filter(f).length;
  const F = S.facet;
  const countries = [...new Set(all.map(r => r.country || ''))];
  const kinds = [...new Set(all.map(r => r.kind))];
  const opt = (set, v, label, n, dot) => `<button class="fopt" data-set="${set}" data-v="${esc(v)}" aria-pressed="${F[set].has(v)}"><span class="box"></span>${dot||''}${esc(label)}<span class="n">${n}</span></button>`;
  $('#facets').innerHTML = `
    <div class="facet"><h4>국가</h4>${countries.map(c => opt('country', c, ccName(c), count(r => (r.country||'') === c))).join('')}</div>
    <div class="facet"><h4>종류</h4>${kinds.map(k => opt('kind', k, k, count(r => r.kind === k))).join('')}</div>
    <div class="facet"><h4>방</h4>${GROUPS.flatMap(g => roomsIn(g.id)).filter(r => r.refs.length).map(r => opt('room', r.id, r.name, r.refs.length, `<span class="dot" style="background:${COLORS[r.color][1]}"></span>`)).join('')}</div>
    <div class="facet"><h4>구독자</h4><select class="sortsel" id="f-subs" style="width:100%">${SUBS_OPTS.map(([v,l]) => `<option value="${v}" ${F.subs===v?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="facet"><h4>저장 이유</h4><select class="sortsel" id="f-why" style="width:100%">
      <option value="all" ${F.why==='all'?'selected':''}>전체</option><option value="yes" ${F.why==='yes'?'selected':''}>적어 둔 것</option><option value="no" ${F.why==='no'?'selected':''}>미작성</option></select></div>`;
  $$('#facets .fopt').forEach(b => b.addEventListener('click', () => {
    const set = F[b.dataset.set], v = b.dataset.v;
    set.has(v) ? set.delete(v) : set.add(v);
    renderFacets(); renderSearchBody();
  }));
  $('#f-subs').addEventListener('change', e => { F.subs = e.target.value; renderSearchBody(); });
  $('#f-why').addEventListener('change', e => { F.why = e.target.value; renderSearchBody(); });
}
function searchHits(){
  const q = S.q.toLowerCase(), F = S.facet;
  const lim = {'1e4':1e4, '1e5':1e5, '1e6':1e6}[F.subs];
  return allRefs().filter(r =>
    (!q || [r.t, r.ch, r.note, r.room.name, r.ai].join(' ').toLowerCase().includes(q)) &&
    (!F.country.size || F.country.has(r.country || '')) &&
    (!F.kind.size || F.kind.has(r.kind)) &&
    (!F.room.size || F.room.has(r.room.id)) &&
    (F.subs === 'all' || (F.subs === 'big' ? Number(r.subs) > 1e6 : (r.subs != null && r.subs !== '' && Number(r.subs) <= lim))) &&
    (F.why === 'all' || (F.why === 'no' ? noReason(r) : !noReason(r))));
}
function hl(text){
  text = String(text || '');
  if(!S.q) return esc(text);
  const i = text.toLowerCase().indexOf(S.q.toLowerCase());
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+S.q.length)) + '</mark>' + esc(text.slice(i+S.q.length));
}
function renderSearchBody(){
  const F = S.facet;
  const chips = [];
  F.country.forEach(v => chips.push(['country', v, ccName(v)]));
  F.kind.forEach(v => chips.push(['kind', v, v]));
  F.room.forEach(v => chips.push(['room', v, (roomOf(v)||{}).name || '?']));
  if(F.subs !== 'all') chips.push(['subs', F.subs, '구독 ' + SUBS_OPTS.find(o => o[0] === F.subs)[1]]);
  if(F.why !== 'all') chips.push(['why', F.why, F.why === 'no' ? '이유 미작성' : '이유 적은 것']);
  const hits = searchHits();
  $('#facts').innerHTML = `<button class="chipbtn ftoggle" id="f-open">${ICONS.filter} 필터</button>
    ${chips.map(([k, v, l]) => `<button class="fchip" data-k="${k}" data-v="${esc(v)}">${esc(l)} ${ICONS.x}</button>`).join('')}
    <span style="margin-left:auto;font-size:12px;color:var(--muted)">${hits.length}개</span>`;
  $('#f-open').addEventListener('click', () => $('#facets').classList.toggle('open'));
  $$('#facts .fchip').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k;
    if(k === 'subs') F.subs = 'all'; else if(k === 'why') F.why = 'all'; else F[k].delete(b.dataset.v);
    renderFacets(); renderSearchBody();
  }));
  const el = $('#search-body');
  if(!hits.length){ el.innerHTML = `<div class="empty"><div class="ico">${ICONS.search}</div><h3>맞는 게 없어요</h3><p>필터를 하나씩 빼 보세요.</p></div>`; return; }
  el.innerHTML = `<div class="reslist">${hits.map(r => `
    <article class="res" data-id="${r.id}" tabindex="0">
      ${r.thumb ? `<img class="rt" src="${esc(r.thumb)}" alt="" loading="lazy" style="object-fit:cover" onerror="this.remove()">` : `<div class="rt" style="${cvar(r.color)}">${esc(String(r.ch||'?')[0])}</div>`}
      <div class="info"><h4>${hl(r.t)}</h4><p>${hl(r.ch)} · ${esc(r.kind)} · 구독 ${fmtShort(r.subs)} · ${noReason(r) ? '이유 미작성' : hl(r.note)}</p></div>
      ${r.country ? `<span class="ccode ${r.countryWhy==='추정'?'guess':''}">${esc(r.country)}</span>` : ''}
      <span class="roomtag"><span class="dot" style="background:${COLORS[r.room.color][1]}"></span>${esc(r.room.name)}</span>
    </article>`).join('')}</div>`;
  $$('#search-body .res').forEach(n => {
    const go = () => { const hit = refById(n.dataset.id); if(hit) openRoom(hit.room.id); };
    n.addEventListener('click', go);
    n.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
  });
}
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); $('#q-clear').hidden = !S.q; renderSearchBody(); });
$('#q-clear').addEventListener('click', () => { $('#q').value = ''; S.q = ''; $('#q-clear').hidden = true; renderSearchBody(); $('#q').focus(); });

/* ═══════ 오늘급상승 ═══════ */
async function loadRising(force){
  const el = $('#rising-body');
  if(!connected()){ el.innerHTML = risingState('시트 연결 전이에요', '⚙ 설정에서 연결하면 측정할 수 있어요.', ''); return; }
  if(!force && RISING.items && Date.now() - RISING.at < 5*60*1000){ renderRising(); return; }
  if(!RISING.items) el.innerHTML = `<p class="slow">급상승을 계산하는 중…</p>`;
  try{
    const j = await api('rising');
    RISING.items = j.items; RISING.meta = j.meta; RISING.criteria = j.meta.criteria; RISING.at = Date.now();
    S.measure = j.meta.measure;
    saveState();
  }catch(e){ el.innerHTML = risingState('급상승을 못 불러왔어요', e.message, `<button class="btn" id="r-retry">다시 시도</button>`); $('#r-retry').addEventListener('click', () => loadRising(true)); return; }
  renderRising();
}
function risingState(h, p, extra){
  return `<div class="state"><div class="ico">${ICONS.trend}</div><div><h3>${esc(h)}</h3><p>${p}</p>${extra||''}</div></div>`;
}
function critHTML(){
  const c = RISING.criteria;
  return `<div class="crit"><span class="c k">기준</span><span class="c">최근 ${c.recentH}시간 속도 ≥ 이전 ${c.baseDays}일 평균 × ${c.mult}</span>
    <span class="c">영상 +${fmt(c.minVideo)}회</span><span class="c">채널 +${fmt(c.minChannel)}명</span>
    <button class="chipbtn" id="r-crit" style="margin-left:auto">${ICONS.gear} 기준 바꾸기</button></div>`;
}
function sparkSVG(vals){
  if(!vals || vals.length < 2) return '<svg class="spark hide-s"></svg>';
  const mn = Math.min(...vals), mx = Math.max(...vals), w = 130, h = 34;
  const pts = vals.map((v,i) => `${(i*(w-4)/(vals.length-1)+2).toFixed(1)},${(h-3-(mx===mn?0.5:(v-mn)/(mx-mn))*(h-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark hide-s" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#7B5BE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function renderRising(){
  const el = $('#rising-body');
  const m = RISING.meta || {};
  const kindOk = it => S.risingKind === 'all' || (S.risingKind === 'video' ? it.type === 'video' : it.type === 'channel');
  const items = (RISING.items || []).filter(kindOk);
  const hot = items.filter(i => i.status === 'hot');
  const normal = items.filter(i => i.status === 'normal');
  const waiting = items.filter(i => i.status === 'waiting');
  const tools = `<div class="rtools"><h2 style="font-size:22px;font-weight:800;letter-spacing:-.03em">오늘급상승</h2>
    <span style="font-size:12.5px;color:var(--muted)">${m.lastRun ? `마지막 측정 ${esc(String(m.lastRun).slice(5,16))}` : '측정 전'}</span>
    <div class="seg" role="group" aria-label="종류" style="margin-left:8px">
      ${[['all','전체'],['video','영상'],['channel','채널']].map(([k,l]) => `<button data-rk="${k}" aria-pressed="${S.risingKind===k}">${l}</button>`).join('')}</div>
    <button class="ghost-btn" id="r-reload" style="margin-left:auto">${ICONS.refresh} 다시 계산</button></div>`;
  let body = '';
  if(!m.measure){
    body = risingState('측정이 꺼져 있어요', '켜면 <b>3시간마다</b> 구글 서버가 유튜브 레퍼의 조회수(영상)·구독자(채널)를 재서 시트 「_측정기록」 탭에 쌓아요. 이 컴퓨터엔 아무 영향이 없고, 유튜브 하루 한도의 1%도 안 써요. 평소 속도와 비교하려면 <b>최소 24시간</b>, 정식 기준(7일 평균)은 <b>7일</b>이 쌓여야 해요.',
      `<button class="btn" id="r-on">측정 켜기</button>`);
  }else if(!hot.length && !normal.length){
    const first = m.first ? String(m.first).slice(5,16) : '';
    body = risingState('측정 중 — 아직 비교할 만큼 안 쌓였어요', `기록 ${m.records||0}줄 · 첫 측정 ${esc(first || '방금')}. 첫 측정 후 24시간이 지나면 속도 비교가 나오고, 7일이 지나면 정식 기준으로 바뀌어요.`, '');
  }
  const row = (it, i, cold) => {
    const r = ROOMS.find(x => x.name === it.room);
    const unit = it.type === 'channel' ? '명' : '회';
    return `<button class="rx ${cold?'cold':''}" data-url="${esc(it.url)}" data-room="${r ? r.id : ''}">
      <span class="rk">${i+1}</span>
      ${it.thumbnail ? `<img class="th ${it.type==='channel'?'ch':''}" src="${esc(it.thumbnail)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="th ${it.type==='channel'?'ch':''}" style="${cvar(r ? r.color : 'lavender')}"></span>`}
      <span style="min-width:0"><span class="tt" style="display:block">${esc(it.title)}</span>
        <span class="sub">${r ? `<span class="dot" style="background:${COLORS[r.color][1]}"></span>` : ''}${esc(it.room || '')} · ${it.type==='channel'?'채널':'영상'}${it.baseKind ? ` · 기준: ${esc(it.baseKind)}` : ''}</span></span>
      ${sparkSVG(it.spark)}
      <span class="gain hide-s"><b>${it.gain >= 0 ? '+' : ''}${fmt(it.gain)}${unit}</b><span>시간당 ${fmt(it.baseRate)} → ${fmt(it.recentRate)}</span></span>
      <span class="mx">${it.mult != null ? (it.mult >= 99 ? '신규' : it.mult.toFixed(1) + '×') : '—'}</span>
    </button>`;
  };
  if(hot.length) body += `<div class="rlistx">${hot.map((it,i) => row(it,i)).join('')}</div>`;
  else if(normal.length) body += `<div class="state" style="margin-bottom:12px"><div class="ico">${ICONS.trend}</div><div><h3>오늘은 기준을 넘은 게 없어요</h3><p>아래는 기준 미달이지만 속도를 잰 것들이에요.</p></div></div>`;
  if(normal.length) body += `<details class="more" ${hot.length?'':'open'}><summary>기준 미달 ${normal.length}개 — 오르는 중인지 보기</summary><div class="rlistx">${normal.map((it,i) => row(it,i,true)).join('')}</div></details>`;

function modePreview(k){
  const b = (l,t,w,h) => `<i style="left:${l}%;top:${t}%;width:${w}%;height:${h}%"></i>`;
  if(k === 'sidebar') return b(3,6,24,88) + b(33,10,14,22) + b(51,10,14,22) + b(69,10,14,22) + b(33,42,14,22);
  if(k === 'classic') return b(30,6,40,10) + b(10,24,80,10) + b(14,44,14,26) + b(32,44,14,26) + b(50,44,14,26);
  if(k === 'kanban') return b(4,8,20,84) + b(28,8,20,84) + b(52,8,20,84) + b(76,8,20,84);
  if(k === 'list') return b(8,10,84,12) + b(8,28,84,12) + b(8,46,84,12) + b(8,64,84,12);
  return b(12,14,16,14) + b(42,8,16,14) + b(72,14,16,14) + `<i style="left:44%;top:66%;width:12%;height:22%;border-radius:50%;background:#F09A5E"></i>`;
}

function mergeFromSheet(j){
  if(Array.isArray(j.groups) && j.groups.length) GROUPS = j.groups.map(g => ({id:g.id, name:g.name, gid:g.gid}));
  if(j.sheetUrl && !CFG.sheetUrl){ CFG.sheetUrl = j.sheetUrl; saveCfg(); }
  if(j.rising) RISING.criteria = j.rising;
  S.trashN = j.trash || 0; S.measure = !!j.measure;
  const gids = new Set(GROUPS.map(g => g.id));
  const old = new Map(ROOMS.map(r => [r.g + '\u0000' + r.name, r]));
  const next = [];
  const take = (g, name, info) => {
    const key = g + '\u0000' + name;
    let r = next.find(x => x.g === g && x.name === name);
    if(r) return r;
    const prev = old.get(key);
    r = {id: prev ? prev.id : nid('s'), g, name,
      color: COLORS[info && info.color] ? info.color : (prev ? prev.color : colorFor(name)),
      glyph: GLYPHS[info && info.glyph] ? info.glyph : (prev ? prev.glyph : 'play'),
      fav: info ? !!info.fav : !!(prev && prev.fav), order: info && info.order != null ? info.order : (prev ? prev.order : null),
      since: info ? info.since : (prev ? prev.since : ''), refs:[]};
    next.push(r); return r;
  };
  (j.rooms || []).forEach(sr => { if(sr.name && gids.has(sr.g)) take(sr.g, sr.name, sr); });
  (j.items || []).forEach(it => {
    if(!gids.has(it.g)) return;
    const room = take(it.g, it.room || '(방 없음)');
    room.refs.push({
      id:it.id || nid('s'), sid:it.id || '', t:it.title || titleFromUrl(it.url), ch:it.channel || hostOf(it.url),
      subs:(it.subs === '' || it.subs == null) ? null : Number(it.subs), note:it.why || '메모 없음', kind:it.kind || kindOf(it.url),
      d:String(it.savedAt || '').slice(0,10), u:it.url, color:colorFor(it.url), ai:it.ai || '', src:it.src || 'pc', row:it.row,
      thumb:it.thumbnail || '', avatar:it.avatar || '', views:it.views ?? null, likes:it.likes ?? null, comments:it.comments ?? null,
      vph:it.vph ?? null, duration:it.duration ?? null, published:it.published || '', handle:it.handle || '', joined:it.joined || '',
      videoCount:it.videoCount ?? null, description:it.description || '', keywords:it.keywords || [], country:it.country || '', countryWhy:it.countryWhy || ''
    });
  });
  /* 아직 시트에 못 올린 것은 남긴다 */
  ROOMS.forEach(r => {
    const pend = r.refs.filter(x => !x.sid);
    if(!pend.length || !gids.has(r.g)) return;
    take(r.g, r.name, null).refs.unshift(...pend);
  });
  ROOMS = next;
  mergeInbox(j.inbox || []);
}
function sheetLooksEmpty(j){
  /* 시트가 '0개'라고 답했는데 이 기기엔 시트에서 온 레퍼가 있으면 — 지우지 말고 멈춘다 */

  const quiet = opt && opt.quiet;
  if(!connected()){ if(!quiet) toast('먼저 ⚙에서 연결해 주세요', true); return; }
  const btn = $('#btn-refresh');
  btn?.classList.add('spin');
  let pushed = 0, failed = 0;
  try{
    for(const room of ROOMS) for(const item of room.refs){
      if(item.sid) continue;
      await syncSave(item, room, null);
      item.sid ? pushed++ : failed++;
    }
    const j = await api('list');
    sheetLooksEmpty(j);
    mergeFromSheet(j); saveState();
    S.libError = false; S.loaded = true;
    renderAfterSync();
    if(!quiet) toast(`맞췄어요 — 시트 ${(j.items||[]).length}개${pushed ? ` · 올린 것 ${pushed}` : ''}${failed ? ` · 실패 ${failed}` : ''}`, failed > 0);
  }catch(e){
    S.libError = true;
    toast('시트와 못 맞췄어요 — ' + e.message, true);
  }finally{ btn?.classList.remove('spin'); }
}
function renderAfterSync(){
  renderChrome();
  if(S.tab === 'shoot') renderShoot();
  if(S.tab === 'library') renderLibrary();
  if(S.tab === 'search'){ renderFacets(); renderSearchBody(); }
  if(S.openRoom && roomOf(S.openRoom)) renderRoomBody();
}
async function bootSync(){
  if(!connected()) return;
  S.libLoading = true;
  try{
    const j = await api('list');
    if(!/^3/.test(String(j.v || ''))) throw new Error('v2 웹앱 주소가 들어 있어요 — 설정에서 v3 주소로 바꿔 주세요');
    const firstGroup = S.group;
    sheetLooksEmpty(j);
    mergeFromSheet(j); saveState();
    S.loaded = true; S.libError = false;
    if(!firstGroup || (firstGroup !== 'fav' && firstGroup !== 'inbox' && !groupOf(firstGroup))) S.group = null;
    renderAfterSync();
    importFromV2();
  }catch(e){
    S.libError = true;
    toast('시트를 불러오지 못했어요 — 이 기기에 있던 것만 보여요: ' + e.message, true);
  }finally{ S.libLoading = false; paintOffbar(); }
}

/* v2 가 이 브라우저에만 갖고 있던 것(시트에 없는 방·레퍼)을 시트로 올린다 — 더하기만, 지우거나 고치지 않음 */
async function importFromV2(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem('shooot.data') || 'null'); }catch{ return; }
  if(!d || !Array.isArray(d.rooms)) return;
  let done = {};
  try{ done = JSON.parse(localStorage.getItem('shoooot3.v2import') || '{}'); }catch{}
  const key = (g, n) => g + '\u0000' + n;
  const rooms = [], refs = [];
  d.rooms.forEach(r => {
    if(!groupOf(r.g) || !r.name) return;
    const k = key(r.g, r.name);
    if(!ROOMS.some(x => x.g === r.g && x.name === r.name) && !done[k]) rooms.push(r);
    (r.refs || []).forEach(x => {
      if(x.sid || !x.u || done['ref:' + x.id]) return;
      const here = ROOMS.find(y => y.g === r.g && y.name === r.name);
      if(here && here.refs.some(y => y.u === x.u)) return;       /* 이미 시트에 같은 링크 */
      refs.push({room:r, x});
    });
  });
  if(!rooms.length && !refs.length) return;
  let ok = 0, fail = 0;
  for(const r of rooms){
    try{
      await api('roomUpsert', {g:r.g, name:r.name, color:r.color, glyph:r.glyph});
      ROOMS.push({id:nid('n'), g:r.g, name:r.name, color:COLORS[r.color] ? r.color : colorFor(r.name), glyph:GLYPHS[r.glyph] ? r.glyph : 'play', fav:false, order:null, refs:[]});
      done[key(r.g, r.name)] = 1; ok++;
    }catch{ fail++; }
  }
  for(const {room, x} of refs){
    try{
      await api('save', {row:{group:room.g, room:room.name, title:x.t, kind:x.kind, channel:x.ch, subs:x.subs, why:x.note, ai:x.ai || '',
        url:x.u, src:x.src || 'pc', glyph:room.glyph, color:room.color, savedAt:x.d || '', lite:true}});
      done['ref:' + x.id] = 1; ok++;
    }catch{ fail++; }
  }
  try{ localStorage.setItem('shoooot3.v2import', JSON.stringify(done)); }catch{}
  saveState();
  if(refs.length) await syncNow({quiet:true}); else renderAfterSync();
  toast(`v2에만 있던 것 ${ok}개(방 ${rooms.length} · 레퍼 ${refs.length})를 시트로 올렸어요` + (fail ? ` · 실패 ${fail}개 — 다음에 켤 때 다시 시도` : ''), fail > 0);
}

/* ═══════ 전역: 닫기 · 포커스 · 연결 띠 ═══════ */
$$('.scrim').forEach(s => s.addEventListener('mousedown', e => { if(e.target === s) closeTop(); }));
function closeTop(){
  if($('#ask-scrim').classList.contains('on')) return closeAsk();
  if($('#shoot-scrim').classList.contains('on')) return closeShootSheet();
  if($('#edit-scrim').classList.contains('on')) return closeEdit();
  if($('#set-scrim').classList.contains('on')) return closeSettings();
  if($('#room-scrim').classList.contains('on')) return closeRoom();
}
document.addEventListener('keydown', e => {
  if(e.key !== 'Tab') return;
  const open = $$('.scrim.on'); if(!open.length) return;
  const scrim = open[open.length - 1];
  const f = $$('a[href],button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])', scrim).filter(el => el.offsetWidth || el.offsetHeight);
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(!scrim.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
  else if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if($$('.scrim.on').length) return closeTop();
    if(S.sel.size){ S.sel.clear(); syncSel(); renderRoomOrLib(); }
  }
});
let offbarDismissed = false;
function paintOffbar(){
  const bar = $('#offbar'); if(!bar) return;
  let msg = '';
  if(!connected()) msg = '시트에 연결되지 않았어요 — 받은 연결 링크를 한 번 열거나 ⚙ 설정에서 v3 웹앱 주소를 넣어 주세요.';
  else if(S.libError) msg = '시트를 불러오지 못했어요 — 이 기기에 있던 것만 보여요. 보관함 › 새로고침으로 다시 시도하세요.';
  $('#offbar-msg').textContent = msg;
  bar.hidden = !msg || offbarDismissed;
}
$('#offbar-x').addEventListener('click', () => { offbarDismissed = true; paintOffbar(); });
$('#offbar-go').addEventListener('click', () => { if(connected()) syncNow(); else openSettings(); });

/* ═══════ 부팅 ═══════ */
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', {scope:'./'}).catch(()=>{});
loadState();
(function receiveSetup(){
  const p = new URLSearchParams(location.search);
  const raw = p.get('setup'); if(!raw) return;
  try{
    const cfg = JSON.parse(decodeURIComponent(escape(atob(raw.replace(/-/g,'+').replace(/_/g,'/')))));
    if(cfg.a) CFG.apiUrl = cfg.a;
    if(cfg.s) CFG.sheetUrl = cfg.s;
    saveCfg();
    try{ history.replaceState(null, '', location.pathname); }catch{}
    setTimeout(()=>toast('이 기기를 시트에 연결했어요'), 400);
  }catch{ setTimeout(()=>toast('연결 링크를 읽지 못했어요', true), 400); }
})();
(function receiveShare(){
  const p = new URLSearchParams(location.search);
  const raw = (p.get('url') || p.get('text') || '').trim();
  const links = extractLinks(raw);
  if(!links.length) return;
  try{ history.replaceState(null, '', location.pathname); }catch{}
  S.group = 'inbox';
  setTimeout(() => addToInbox(links), 300);
})();
renderChrome();
setTab('shoot');
paintOffbar();
bootSync();

})();
</script>
